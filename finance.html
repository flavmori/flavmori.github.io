<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolio Rebalancer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#0a0a0f,#1a1a2e,#16213e);min-height:100vh;padding:24px;color:#e2e8f0;letter-spacing:-.01em;font-size:14px}
#lock{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;gap:16px}
#lock input{font-family:'Inter',sans-serif;padding:12px 20px;border-radius:8px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.04);color:#fff;font-size:1em;text-align:center;width:240px}
#lock button{font-family:'Inter',sans-serif;padding:10px 24px;border-radius:8px;border:none;background:#3b82f6;color:#fff;font-size:.9em;cursor:pointer;font-weight:500}
#lock .err{color:#ef4444;font-size:.8em}
#app{display:none}
.container{max-width:860px;margin:0 auto}
h1{text-align:center;font-size:1.6em;margin-bottom:4px;font-weight:700;letter-spacing:-.03em;color:#f8fafc}
.subtitle{text-align:center;opacity:.4;margin-bottom:28px;font-size:.8em;text-transform:uppercase;letter-spacing:.05em}
.card{background:rgba(255,255,255,.03);border-radius:12px;padding:18px;border:1px solid rgba(255,255,255,.06);margin-bottom:16px}
.card-title{font-size:.75em;font-weight:600;margin-bottom:12px;text-transform:uppercase;letter-spacing:.06em;opacity:.4}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:600px){.grid2,.grid3{grid-template-columns:1fr 1fr}}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:.7em;opacity:.4;font-weight:500;text-transform:uppercase;letter-spacing:.03em}
.field input{font-family:'Inter',sans-serif;padding:9px 11px;border-radius:6px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#f1f5f9;font-size:.9em;width:100%}
.field input:focus{outline:none;border-color:#3b82f6}
.total-bar{text-align:center;padding:20px;background:rgba(255,255,255,.04);border-radius:12px;margin-bottom:16px;border:1px solid rgba(255,255,255,.08)}
.total-bar .big{font-size:2em;font-weight:700;color:#f8fafc}
.total-bar .sub{opacity:.4;font-size:.78em;margin-top:6px;line-height:1.6}
.bucket{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:8px;margin-bottom:5px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.04)}
.bucket .lbl{width:130px;font-size:.78em;font-weight:500;line-height:1.3}
.bucket .lbl small{display:block;font-weight:400;opacity:.35;font-size:.9em}
.bucket .bar-wrap{flex:1;height:18px;background:rgba(255,255,255,.05);border-radius:4px;position:relative;overflow:hidden}
.bucket .bar-fill{height:100%;border-radius:4px;position:absolute;top:0;left:0;transition:width .3s}
.bucket .bar-marker{position:absolute;top:0;height:100%;width:1.5px;background:rgba(255,255,255,.4)}
.bucket .bar-pct{position:absolute;top:50%;right:6px;transform:translateY(-50%);font-size:.65em;font-weight:600;opacity:.7}
.bucket .val{width:130px;text-align:right;font-size:.72em;line-height:1.4;font-variant-numeric:tabular-nums}
.pos{color:#10b981}.neg{color:#ef4444}.muted{opacity:.35}
.alert-box{padding:9px 14px;border-radius:6px;margin-bottom:14px;font-size:.78em;display:none}
.alert-box.show{display:block}
.alert-warn{background:rgba(245,158,11,.06);border:1px solid rgba(245,158,11,.15);color:#f59e0b}
.alert-ok{background:rgba(16,185,129,.06);border:1px solid rgba(16,185,129,.15);color:#10b981}
.suggest-box{padding:18px;border-radius:10px;margin-bottom:16px;border:1px solid rgba(59,130,246,.15);background:rgba(59,130,246,.04)}
.suggest-box .title{font-size:.8em;font-weight:600;margin-bottom:12px;color:#93c5fd;text-transform:uppercase;letter-spacing:.04em}
.suggest-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:.85em}
.suggest-row:last-child{border:none}
.suggest-row .v{font-weight:600;font-variant-numeric:tabular-nums}
.suggest-row .note{font-size:.75em;opacity:.4}
.suggest-section{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.06)}
.suggest-section .label{font-size:.7em;opacity:.4;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.config-row{display:flex;gap:10px;align-items:end}
.config-row .field{flex:1}
.rebal-row{padding:11px 12px;border-radius:8px;margin-bottom:5px;border:1px solid rgba(139,92,246,.15);background:rgba(139,92,246,.03)}
.rebal-row .inner{display:flex;align-items:center;gap:12px;font-size:.78em}
.rebal-row .lbl{color:#a78bfa;font-weight:500;width:130px}
.rebal-row .detail{opacity:.5}
.settings{display:none;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.06)}
.settings .grid2{margin-bottom:10px}
.settings .note{font-size:.7em;opacity:.35;margin-top:6px}
.btn{font-family:'Inter',sans-serif;padding:8px 16px;border-radius:6px;border:none;color:#fff;font-size:.78em;cursor:pointer;font-weight:500}
.btn:active{transform:scale(.97)}
.btn-primary{background:#3b82f6}
.btn-secondary{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.history-chart{width:100%;height:130px;position:relative;margin-top:8px}
.history-list{max-height:120px;overflow-y:auto;font-size:.7em;margin-top:8px}
.history-list .entry{display:flex;justify-content:space-between;padding:3px 6px;border-bottom:1px solid rgba(255,255,255,.03)}
.sync-status{font-size:.65em;opacity:.35;text-align:center;margin-top:6px}
.nav-link{position:fixed;top:14px;left:14px;font-size:.75em;opacity:.3;text-decoration:none;color:#fff}
.nav-link:hover{opacity:.7}
</style>
</head>
<body>
<a href="index.html" class="nav-link">< back</a>
<div id="lock">
<input type="password" id="pw" placeholder="Password" onkeydown="if(event.key==='Enter')unlock()">
<button onclick="unlock()">Enter</button>
<div class="err" id="err"></div>
</div>
<div id="app"><div class="container">
<h1>Portfolio Rebalancer</h1>
<p class="subtitle">Allocation · Rebalancing · Tracking</p>

<div class="total-bar">
<div class="big" id="tot">-</div>
<div class="sub" id="totSub"></div>
</div>
<div class="alert-box" id="alert"></div>

<div class="card">
<div class="card-title">Current Balances</div>
<div class="grid3">
<div class="field"><label>ACWI</label><input type="number" id="s_acwi" step=".01" oninput="calc()"></div>
<div class="field"><label>Gov Bond</label><input type="number" id="s_gov" step=".01" oninput="calc()"></div>
<div class="field"><label>CSH2 (Money Market)</label><input type="number" id="s_csh2" step=".01" oninput="calc()"></div>
<div class="field"><label>Santander</label><input type="number" id="s_sant" step=".01" oninput="calc()"></div>
<div class="field"><label>TR Cash</label><input type="number" id="s_trcash" step=".01" oninput="calc()"></div>
<div class="field"><label>Other Cash (PayPal etc)</label><input type="number" id="s_other" step=".01" oninput="calc()"></div>
</div>
<div class="grid2" style="margin-top:10px">
<div class="field"><label>BTC (current value, 0 if not bought)</label><input type="number" id="s_btc" step=".01" oninput="calc()"></div>
</div>
</div>

<div class="card">
<div class="card-title">Allocation vs Target</div>
<div id="buckets"></div>
</div>

<div class="suggest-box" id="suggestBox"></div>

<div class="card">
<div class="card-title">Configuration</div>
<div class="config-row">
<div class="field"><label>Investment Cap</label><input type="number" id="cfg_cap" value="2500" step="100" oninput="calc()"></div>
</div>
<div class="settings" id="settingsPanel">
<div class="card-title" style="margin-top:0">Target Allocation (%)</div>
<div class="grid2">
<div class="field"><label>Invested</label><input type="number" id="t_inv" step="1" oninput="updateT()"></div>
<div class="field"><label>Liquid (remunerated)</label><input type="number" id="t_liqr" step="1" oninput="updateT()"></div>
<div class="field"><label>Cash Floor (min on accounts)</label><input type="number" id="t_cash" step="1" oninput="updateT()"></div>
<div class="field"><label>High Risk</label><input type="number" id="t_risk" step="1" oninput="updateT()"></div>
</div>
<div class="card-title" style="margin-top:12px">Investment Ratio (%)</div>
<div class="grid2">
<div class="field"><label>ACWI (equity)</label><input type="number" id="r_acwi" step="1" oninput="updateT()"></div>
<div class="field"><label>Gov Bond</label><input type="number" id="r_gov" step="1" oninput="updateT()"></div>
</div>
<div class="note" id="settingsMsg"></div>
</div>
<div class="actions" style="margin-top:12px">
<button class="btn btn-primary" onclick="save()">Save Snapshot</button>
<button class="btn btn-secondary" onclick="toGist()">Sync Cloud</button>
<button class="btn btn-secondary" onclick="fromGist()">Load Cloud</button>
<button class="btn btn-secondary" onclick="toggleSettings()">Settings</button>
</div>
<div class="sync-status" id="ss"></div>
</div>

<div class="card">
<div class="card-title">History</div>
<div class="history-chart"><canvas id="cv"></canvas></div>
<div class="history-list" id="hl"></div>
</div>
</div></div>

<script>
const GIST_ID='17fedcdc8ee90458b9513999b55a4813',GF='finance.json',PW='flavmori2210';
const KS=['acwi','gov','csh2','sant','trcash','other','btc'];
// Buckets: invested (ACWI+Gov), liquid_remunerated (CSH2), cash (Santander+TR+Other), high_risk (BTC)
let T={invested:74,liquid:14,cash:7,risk:5};
let R={acwi:80,gov:20};
let hist=[],btcConf={budget:5000,entry:40000,sell:95000};

function unlock(){if($('pw').value===PW){localStorage.setItem('fa','1');show();init()}else $('err').textContent='Wrong'}
function show(){$('lock').style.display='none';$('app').style.display='block'}
function $(id){return document.getElementById(id)}
function J(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function fm(n){return Math.round(n).toLocaleString('it-IT')}
function getS(){let s={};KS.forEach(k=>s[k]=parseFloat($('s_'+k).value)||0);return s}

function init(){
  let s=J('fin_s')||{};KS.forEach(k=>{if(s[k])$('s_'+k).value=s[k]});
  btcConf=J('fin_btc')||btcConf;
  T=J('fin_t')||T;R=J('fin_r')||R;
  let cfg=J('fin_cfg')||{};if(cfg.cap)$('cfg_cap').value=cfg.cap;
  hist=J('fin_h')||[];
  $('t_inv').value=T.invested;$('t_liqr').value=T.liquid;$('t_cash').value=T.cash;$('t_risk').value=T.risk;
  $('r_acwi').value=R.acwi;$('r_gov').value=R.gov;
  calc();renderHist();
}

function calc(){
  const s=getS();
  const total=KS.reduce((a,k)=>a+s[k],0);
  const invested=s.acwi+s.gov;
  const liquid=s.csh2; // remunerated liquidity
  const cash=s.sant+s.trcash+s.other; // non-remunerated cash
  const risk=s.btc;

  // Display
  $('tot').textContent=total>0?'€'+fm(total):'-';
  if(total>0){
    const r=invested>0?Math.round(s.acwi/invested*100)+'/'+Math.round(s.gov/invested*100):'—';
    $('totSub').innerHTML=`Invested €${fm(invested)} (${r}) · Liquid €${fm(liquid)} · Cash €${fm(cash)} · Risk €${fm(risk)}`;
  }

  // Alert
  const liqTot=liquid+cash;
  const liqPct=total>0?liqTot/total*100:0;
  const minLiq=T.liquid+T.cash;
  const al=$('alert');
  if(total>0&&liqPct<minLiq){al.className='alert-box alert-warn show';al.textContent=`Liquidity ${liqPct.toFixed(1)}% — below ${minLiq}% target. Consider pausing investments.`}
  else if(total>0){al.className='alert-box alert-ok show';al.textContent=`Liquidity ${liqPct.toFixed(1)}% (target ${minLiq}%) — OK`}
  else al.className='alert-box';

  // Buckets
  const bks=[
    {name:'Invested',sub:`ACWI/Gov ${R.acwi}/${R.gov}`,val:invested,tgt:T.invested,color:'#3b82f6'},
    {name:'Liquid',sub:'Remunerated (CSH2)',val:liquid,tgt:T.liquid,color:'#f59e0b'},
    {name:'Cash Floor',sub:'Min on accounts',val:cash,tgt:T.cash,color:'#6b7280'},
    {name:'High Risk',sub:'BTC / Speculation',val:risk,tgt:T.risk,color:'#ef4444'},
  ];
  let bhtml='';
  bks.forEach(b=>{
    const pct=total>0?b.val/total*100:0;
    const tgtE=b.tgt/100*total;
    const gap=tgtE-b.val;
    const mx=Math.max(pct,b.tgt,1);
    const bw=Math.min(pct/mx*100,100);
    const mp=b.tgt/mx*100;
    const gt=Math.abs(gap)<50?'<span class="muted">OK</span>':(gap>0?`<span class="neg">-€${fm(Math.abs(gap))}</span>`:`<span class="pos">+€${fm(-gap)} over</span>`);
    bhtml+=`<div class="bucket"><div class="lbl">${b.name}<small>${b.sub}</small></div><div class="bar-wrap"><div class="bar-fill" style="width:${bw}%;background:${b.color};opacity:.45"></div><div class="bar-marker" style="left:${mp}%"></div><div class="bar-pct">${pct.toFixed(0)}%/${b.tgt}%</div></div><div class="val">${gt}<br><span class="muted">€${fm(b.val)} / €${fm(tgtE)}</span></div></div>`;
  });
  // Rebalance alert (ratio drift >5pts)
  if(invested>0){
    const acwiR=s.acwi/invested*100;
    const drift=Math.abs(acwiR-R.acwi);
    if(drift>5){
      const from=acwiR>R.acwi?'ACWI':'Gov Bond';
      const to=acwiR>R.acwi?'Gov Bond':'ACWI';
      const amt=Math.round(Math.abs(s.acwi-(R.acwi/100)*invested));
      bhtml+=`<div class="rebal-row"><div class="inner"><span class="lbl">Rebalance</span><span>Sell €${fm(amt)} ${from} → Buy ${to}</span><span class="detail">(ratio ${Math.round(acwiR)}/${Math.round(100-acwiR)} vs target ${R.acwi}/${R.gov})</span></div></div>`;
    }
  }
  $('buckets').innerHTML=bhtml;

  // Suggestions
  const cap=parseFloat($('cfg_cap').value)||2500;
  const investTarget=T.invested/100*total;
  const liqTarget=T.liquid/100*total;
  const cashTarget=T.cash/100*total;
  const riskTarget=T.risk/100*total;

  const investGap=Math.max(0,investTarget-invested);
  const liqGap=Math.max(0,liqTarget-liquid);
  const cashExcess=Math.max(0,cash-cashTarget);
  const riskGap=Math.max(0,riskTarget-risk);

  let shtml='<div class="title">Suggested Actions</div>';
  let hasAction=false;

  // 1. Move cash → liquid (remunerate)
  if(liqGap>0&&cashExcess>0){
    const moveToLiq=Math.min(liqGap,cashExcess);
    if(moveToLiq>=50){
      shtml+=`<div class="suggest-row"><span>Move to CSH2 <span class="note">(remunerate idle cash)</span></span><span class="v" style="color:#f59e0b">€${fm(moveToLiq)}</span></div>`;
      hasAction=true;
    }
  }

  // 2. Invest (capped)
  const investable=Math.max(0,cashExcess-Math.max(0,liqGap));
  if(investable>=300){
    const amt=Math.min(investable,cap);
    const acwiAmt=Math.round(amt*R.acwi/100);
    const govAmt=amt-acwiAmt;
    shtml+=`<div class="suggest-section"><div class="label">Invest (cap €${fm(cap)})</div>`;
    shtml+=`<div class="suggest-row"><span>ACWI <span class="note">(${R.acwi}%)</span></span><span class="v" style="color:#3b82f6">€${fm(acwiAmt)}</span></div>`;
    shtml+=`<div class="suggest-row"><span>Gov Bond <span class="note">(${R.gov}%)</span></span><span class="v" style="color:#10b981">€${fm(govAmt)}</span></div>`;
    if(investable>cap)shtml+=`<div class="suggest-row"><span class="note">Remaining for future</span><span class="muted">€${fm(investable-amt)}</span></div>`;
    shtml+=`</div>`;
    hasAction=true;
  }else if(investGap>0&&investable<300){
    shtml+=`<div class="suggest-section"><div class="label">Invest</div><div class="suggest-row"><span class="muted">Not enough in cash buffer. Accumulate.</span><span></span></div></div>`;
    hasAction=true;
  }

  // 3. High risk
  if(riskGap>0){
    shtml+=`<div class="suggest-section"><div class="label">High Risk (${T.risk}% target)</div>`;
    shtml+=`<div class="suggest-row"><span>BTC <span class="note">Buy at ~€${fm(btcConf.entry)}</span></span><span class="v" style="color:#ef4444">€${fm(riskGap)}</span></div>`;
    shtml+=`</div>`;
    hasAction=true;
  }else if(risk>riskTarget+100){
    shtml+=`<div class="suggest-section"><div class="label">High Risk</div><div class="suggest-row"><span class="muted">Over target — consider taking profit</span><span class="pos">+€${fm(risk-riskTarget)}</span></div></div>`;
    hasAction=true;
  }

  if(!hasAction)shtml+=`<div class="suggest-row"><span class="muted">All buckets on target. Nothing to do.</span><span></span></div>`;
  $('suggestBox').innerHTML=shtml;

  // Persist
  localStorage.setItem('fin_s',JSON.stringify(s));
  localStorage.setItem('fin_btc',JSON.stringify(btcConf));
  localStorage.setItem('fin_cfg',JSON.stringify({cap}));
}

function toggleSettings(){const p=$('settingsPanel');p.style.display=p.style.display==='none'?'block':'none'}
function updateT(){
  T={invested:+$('t_inv').value||74,liquid:+$('t_liqr').value||14,cash:+$('t_cash').value||7,risk:+$('t_risk').value||5};
  R={acwi:+$('r_acwi').value||80,gov:+$('r_gov').value||20};
  const ts=T.invested+T.liquid+T.cash+T.risk;
  const rs=R.acwi+R.gov;
  $('settingsMsg').innerHTML=(Math.abs(ts-100)>0.5?`<span class="neg">Targets: ${ts}% (must be 100)</span>`:`Targets: ${ts}%`)+' · '+(Math.abs(rs-100)>0.5?`<span class="neg">Ratio: ${rs}% (must be 100)</span>`:`Ratio: ${rs}%`);
  localStorage.setItem('fin_t',JSON.stringify(T));localStorage.setItem('fin_r',JSON.stringify(R));
  calc();
}

function save(){
  const s=getS();const total=KS.reduce((a,k)=>a+s[k],0);if(total<=0)return;
  const e={d:new Date().toISOString().slice(0,10),t:total,s:{...s}};
  hist=hist.filter(h=>h.d!==e.d);hist.push(e);hist.sort((a,b)=>a.d.localeCompare(b.d));
  localStorage.setItem('fin_h',JSON.stringify(hist));renderHist();
  $('ss').textContent='Saved '+new Date().toLocaleTimeString();
}

function renderHist(){
  let h='';[...hist].reverse().forEach(e=>{h+=`<div class="entry"><span>${e.d}</span><span>€${fm(e.t)}</span></div>`});
  $('hl').innerHTML=h||'<div class="muted" style="padding:6px;text-align:center">No data yet</div>';
  drawChart();
}

function drawChart(){
  const c=$('cv'),ctx=c.getContext('2d'),dpr=window.devicePixelRatio||1;
  const W=c.parentElement.getBoundingClientRect().width,H=130;
  c.width=W*dpr;c.height=H*dpr;ctx.scale(dpr,dpr);ctx.clearRect(0,0,W,H);
  if(hist.length<2){ctx.fillStyle='rgba(255,255,255,.15)';ctx.font='11px Inter';ctx.textAlign='center';ctx.fillText('Min 2 snapshots',W/2,H/2);return}
  const vs=hist.map(h=>h.t),mn=Math.min(...vs)*.95,mx=Math.max(...vs)*1.05;
  const p={t:12,b:18,l:40,r:10};
  ctx.strokeStyle='rgba(255,255,255,.04)';
  for(let i=0;i<4;i++){const y=p.t+(H-p.t-p.b)*i/3;ctx.beginPath();ctx.moveTo(p.l,y);ctx.lineTo(W-p.r,y);ctx.stroke();ctx.fillStyle='rgba(255,255,255,.2)';ctx.font='8px Inter';ctx.textAlign='right';ctx.fillText('€'+fm(mx-(mx-mn)*i/3),p.l-4,y+3)}
  ctx.strokeStyle='#3b82f6';ctx.lineWidth=1.5;ctx.lineJoin='round';ctx.beginPath();
  hist.forEach((h,i)=>{const x=p.l+i*(W-p.l-p.r)/(hist.length-1);const y=p.t+(1-(h.t-mn)/(mx-mn))*(H-p.t-p.b);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();
  hist.forEach((h,i)=>{const x=p.l+i*(W-p.l-p.r)/(hist.length-1);const y=p.t+(1-(h.t-mn)/(mx-mn))*(H-p.t-p.b);ctx.beginPath();ctx.arc(x,y,2,0,Math.PI*2);ctx.fillStyle='#93c5fd';ctx.fill()});
}

function tk(){return localStorage.getItem('ght')||prompt('GitHub Token:')}
async function toGist(){
  const t=tk();if(!t)return;localStorage.setItem('ght',t);
  const d={s:getS(),btc:btcConf,cfg:{cap:+$('cfg_cap').value},T,R,h:hist,u:new Date().toISOString()};
  try{const r=await fetch('https://api.github.com/gists/'+GIST_ID,{method:'PATCH',headers:{'Authorization':'token '+t,'Content-Type':'application/json'},body:JSON.stringify({files:{[GF]:{content:JSON.stringify(d)}}})});$('ss').textContent=r.ok?'Synced':'Error '+r.status}catch(e){$('ss').textContent=e.message}
}
async function fromGist(){
  const t=tk();if(!t)return;localStorage.setItem('ght',t);
  try{const r=await fetch('https://api.github.com/gists/'+GIST_ID,{headers:{'Authorization':'token '+t}});if(!r.ok)return;
  const g=await r.json();if(!g.files[GF])return;const d=JSON.parse(g.files[GF].content);
  if(d.s)KS.forEach(k=>{$('s_'+k).value=d.s[k]||0});
  if(d.btc)btcConf=d.btc;
  if(d.cfg)$('cfg_cap').value=d.cfg.cap||2500;
  if(d.T){T=d.T;$('t_inv').value=T.invested;$('t_liqr').value=T.liquid;$('t_cash').value=T.cash;$('t_risk').value=T.risk}
  if(d.R){R=d.R;$('r_acwi').value=R.acwi;$('r_gov').value=R.gov}
  if(d.h){hist=d.h;localStorage.setItem('fin_h',JSON.stringify(hist))}
  localStorage.setItem('fin_t',JSON.stringify(T));localStorage.setItem('fin_r',JSON.stringify(R));
  calc();renderHist();$('ss').textContent='Loaded'}catch(e){$('ss').textContent=e.message}
}

if(localStorage.getItem('fa')==='1'){show();if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init()}else $('pw').focus();
window.addEventListener('resize',()=>drawChart());
</script>
