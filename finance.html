<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0b0f1a;min-height:100vh;padding:20px;color:#cbd5e1;font-size:13px}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}

.w{max-width:720px;margin:0 auto}
.total{text-align:center;font-size:2em;font-weight:700;color:#f8fafc;margin:16px 0 4px}
.total-d{text-align:center;font-size:.7em;opacity:.3;margin-bottom:24px}
.sec{margin-bottom:20px}
.sec-h{font-size:.65em;font-weight:600;text-transform:uppercase;letter-spacing:.08em;opacity:.25;margin-bottom:8px}
.irow{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #111827}
.irow:last-child{border:none}
.irow label{font-size:.78em;color:#94a3b8;flex:1}
.irow label small{opacity:.4}
.irow input{font-family:'Inter',sans-serif;width:100px;padding:5px 7px;border-radius:4px;border:1px solid #1e293b;background:#0f172a;color:#f1f5f9;font-size:.82em;text-align:right}
.irow input:focus{outline:none;border-color:#2563eb}
.arow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #111827}
.arow:last-child{border:none}
.arow .l{font-size:.8em;color:#e2e8f0}
.arow .r{font-size:.78em;text-align:right;font-variant-numeric:tabular-nums}
.arow .gap{font-weight:600;font-size:.75em}
.arow.sub{padding-left:16px}
.arow.sub .l{color:#94a3b8;font-size:.75em}
.arow.sub .r{font-size:.72em;opacity:.6}
.pos{color:#10b981}.neg{color:#ef4444}.mu{opacity:.3}
.acts{background:#0f172a;border:1px solid #1e293b;border-radius:8px;padding:14px;margin-bottom:20px}
.acts .ah{font-size:.68em;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#60a5fa;margin-bottom:10px}
.act{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #1e293b;font-size:.8em}
.act:last-child{border:none}
.act .av{font-weight:600;font-variant-numeric:tabular-nums}
.act .icon{width:18px;opacity:.5}
.act-sep{border-top:1px solid #1e293b;margin:8px 0}
.act-note{font-size:.68em;opacity:.3;margin-top:4px}
.btn{padding:7px 14px;border-radius:5px;border:none;color:#fff;font-size:.7em;cursor:pointer;font-weight:500}
.btn-p{background:#2563eb}.btn-s{background:#1e293b}
.foot{display:flex;gap:8px;flex-wrap:wrap}
.sync{font-size:.58em;opacity:.2;text-align:center;margin-top:5px}
.hl{max-height:100px;overflow-y:auto;font-size:.62em}
.hl div{display:flex;justify-content:space-between;padding:2px 4px;border-bottom:1px solid #111827}
.sov{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);z-index:100;overflow-y:auto;padding:40px 20px}
.sp{max-width:440px;margin:0 auto;background:#0f172a;border:1px solid #1e293b;border-radius:8px;padding:20px}
.sp h2{font-size:.95em;font-weight:600;color:#f8fafc;margin-bottom:14px}
.sp .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.sp label{font-size:.65em;opacity:.4;text-transform:uppercase;display:block;margin-bottom:2px}
.sp input{font-family:'Inter',sans-serif;width:100%;padding:6px 8px;border-radius:4px;border:1px solid #1e293b;background:#0b0f1a;color:#f1f5f9;font-size:.82em}
.sp input:focus{outline:none;border-color:#2563eb}
.sp .msg{font-size:.65em;opacity:.35;margin-top:3px}
.sp .sh{font-size:.68em;opacity:.3;margin:12px 0 6px;text-transform:uppercase}
</style>
</head>
<body>

<div id="app" style="display:block"><div class="w">
<div class="total" id="tot">-</div>
<div class="total-d" id="totD"></div>

<div class="sec">
<div class="sec-h">Balances</div>
<div class="irow"><label>Equity <small>ACWI</small></label><input type="number" id="s_eq" step=".01" oninput="calc()"></div>
<div class="irow"><label>Bond <small>Gov EUR</small></label><input type="number" id="s_bo" step=".01" oninput="calc()"></div>
<div class="irow"><label>Money Market <small>CSH2</small></label><input type="number" id="s_mm" step=".01" oninput="calc()"></div>
<div class="irow"><label>Cash <small>Santander</small></label><input type="number" id="s_c1" step=".01" oninput="calc()"></div>
<div class="irow"><label>Cash <small>Trade Republic</small></label><input type="number" id="s_c2" step=".01" oninput="calc()"></div>
<div class="irow"><label>Cash <small>Other</small></label><input type="number" id="s_c3" step=".01" oninput="calc()"></div>
<div class="irow"><label>Satellite <small>BTC</small></label><input type="number" id="s_sa" step=".01" oninput="calc()"></div>
</div>

<div class="sec">
<div class="sec-h">Allocation</div>
<div id="alloc"></div>
</div>

<div class="acts" id="acts"></div>

<div class="sec">
<div class="sec-h">I need cash</div>
<div class="irow"><label>How much do you need?</label><input type="number" id="w_amt" step="100" oninput="calcW()"></div>
<div id="wResult"></div>
</div>

<div class="sec">
<div class="sec-h">Snapshots</div>
<div class="hl" id="hl"></div>
</div>

<div class="foot">
<button class="btn btn-p" onclick="saveAll()">Save</button>
<button class="btn btn-s" onclick="openS()">Settings</button>
<a href="finance-guide.html" target="_blank" class="btn btn-s" style="text-decoration:none;display:inline-block">Guide</a>
</div>
<div class="sync" id="ss"></div>
</div></div>

<div class="sov" id="sOv"><div class="sp">
<h2>Settings</h2>
<div class="sh">Allocation (must sum 100%)</div>
<div class="g2">
<div><label>Invested %</label><input type="number" id="t_inv" step="1" oninput="upT()"></div>
<div><label>Liquid %</label><input type="number" id="t_liq" step="1" oninput="upT()"></div>
<div><label>Satellite %</label><input type="number" id="t_sat" step="1" oninput="upT()"></div>
</div>
<div class="msg" id="m1"></div>
<div class="sh">Within Invested (must sum 100%)</div>
<div class="g2">
<div><label>Equity %</label><input type="number" id="r_eq" step="1" oninput="upT()"></div>
<div><label>Bond %</label><input type="number" id="r_bo" step="1" oninput="upT()"></div>
</div>
<div class="msg" id="m2"></div>
<div class="sh">Within Liquid (must sum 100%)</div>
<div class="g2">
<div><label>Money Market %</label><input type="number" id="r_mm" step="1" oninput="upT()"></div>
<div><label>Cash %</label><input type="number" id="r_ca" step="1" oninput="upT()"></div>
</div>
<div class="msg" id="m3"></div>
<div class="sh">Caps</div>
<div class="g2">
<div><label>Investment Cap (€)</label><input type="number" id="cfg_cap" step="100" oninput="saveCfg()"></div>
</div>
<div class="sh">Unrealized gain (%)</div>
<div class="g2">
<div><label>Equity gain %</label><input type="number" id="cfg_gEq" step="1" oninput="saveCfg()"></div>
<div><label>Bond gain %</label><input type="number" id="cfg_gBo" step="1" oninput="saveCfg()"></div>
<div><label>Satellite gain %</label><input type="number" id="cfg_gSa" step="1" oninput="saveCfg()"></div>
</div>
<div class="sh">BTC Tranches (buy)</div>
<div class="g2">
<div><label>Buy 1 (€)</label><input type="number" id="btc_b1" step="1000" oninput="saveB()"></div>
<div><label>Buy 2 (€)</label><input type="number" id="btc_b2" step="1000" oninput="saveB()"></div>
<div><label>Buy 3 (€)</label><input type="number" id="btc_b3" step="1000" oninput="saveB()"></div>
</div>
<div class="sh">BTC Tranches (sell)</div>
<div class="g2">
<div><label>Sell 1 (€)</label><input type="number" id="btc_s1" step="1000" oninput="saveB()"></div>
<div><label>Sell 2 (€)</label><input type="number" id="btc_s2" step="1000" oninput="saveB()"></div>
<div><label>Sell 3 (€)</label><input type="number" id="btc_s3" step="1000" oninput="saveB()"></div>
</div>
<div class="sh">Cloud Sync</div>
<div><label>GitHub Token (for cross-device sync)</label><input type="text" id="ghToken" style="width:100%;margin-top:4px" onchange="localStorage.setItem('ght',this.value)" placeholder="ghp_..."></div>
<button class="btn btn-s" style="margin-top:14px" onclick="closeS()">Close</button>
</div></div>

<script>
const GID='17fedcdc8ee90458b9513999b55a4813',GF='finance.json';
const KS=['eq','bo','mm','c1','c2','c3','sa'];
let T={inv:80,liq:15,sat:5,r_eq:80,r_bo:20,r_mm:60,r_ca:40};
let cfg={cap:2500,gEq:1.63,gBo:0.31,gSa:0};
let btc={buy:[50000,45000,38000],sell:[80000,95000,110000]};
let hist=[];

function $(id){return document.getElementById(id)}
function J(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function fm(n){return Math.round(n).toLocaleString('it-IT')}
function getS(){let s={};KS.forEach(k=>s[k]=parseFloat($('s_'+k).value)||0);return s}

function init(){
  const s=J('fs')||{};KS.forEach(k=>{if(s[k])$('s_'+k).value=s[k]});
  T=J('ft')||T;cfg=J('fc')||cfg;btc=J('fb')||btc;hist=J('fh')||[];
  if(!btc.buy)btc={buy:[50000,45000,38000],sell:[80000,95000,110000]};
  $('t_inv').value=T.inv;$('t_liq').value=T.liq;$('t_sat').value=T.sat;
  $('r_eq').value=T.r_eq;$('r_bo').value=T.r_bo;$('r_mm').value=T.r_mm;$('r_ca').value=T.r_ca;
  $('cfg_cap').value=cfg.cap;
  $('cfg_gEq').value=cfg.gEq||0;$('cfg_gBo').value=cfg.gBo||0;$('cfg_gSa').value=cfg.gSa||0;
  $('btc_b1').value=btc.buy?btc.buy[0]:50000;$('btc_b2').value=btc.buy?btc.buy[1]:45000;$('btc_b3').value=btc.buy?btc.buy[2]:38000;
  $('btc_s1').value=btc.sell?btc.sell[0]:80000;$('btc_s2').value=btc.sell?btc.sell[1]:95000;$('btc_s3').value=btc.sell?btc.sell[2]:110000;
  $('ghToken').value=localStorage.getItem('ght')||'';
  calc();rH();
}

function calc(){
  const s=getS();
  const total=KS.reduce((a,k)=>a+s[k],0);
  const eq=s.eq,bo=s.bo,mm=s.mm,cash=s.c1+s.c2+s.c3,sat=s.sa;
  const invested=eq+bo,liquid=mm+cash;

  $('tot').textContent=total>0?'€'+fm(total):'-';
  $('totD').textContent=total>0?`Invested €${fm(invested)} · Liquid €${fm(liquid)} · Satellite €${fm(sat)}`:'';

  // Derived targets (€)
  const tInv=T.inv/100*total, tLiq=T.liq/100*total, tSat=T.sat/100*total;
  const tEq=T.r_eq/100*tInv, tBo=T.r_bo/100*tInv;
  const tMm=T.r_mm/100*tLiq, tCa=T.r_ca/100*tLiq;

  // Allocation display
  const pInv=total>0?(invested/total*100).toFixed(0):0;
  const pLiq=total>0?(liquid/total*100).toFixed(0):0;
  const pSat=total>0?(sat/total*100).toFixed(0):0;
  const gInv=tInv-invested,gLiq=tLiq-liquid,gSat=tSat-sat;
  const subEq=invested>0?(eq/invested*100).toFixed(0):0;
  const subBo=invested>0?(bo/invested*100).toFixed(0):0;
  const subMm=liquid>0?(mm/liquid*100).toFixed(0):0;
  const subCa=liquid>0?(cash/liquid*100).toFixed(0):0;

  function gapH(g){return Math.abs(g)<50?'<span class="mu">—</span>':(g>0?`<span class="neg">-€${fm(Math.abs(g))}</span>`:`<span class="pos">+€${fm(-g)}</span>`)}

  let a='';
  a+=`<div class="arow"><span class="l">Invested</span><span class="r">€${fm(invested)} <span class="mu">${pInv}% → ${T.inv}%</span> <span class="gap">${gapH(gInv)}</span></span></div>`;
  a+=`<div class="arow sub"><span class="l">Equity <small>ACWI</small></span><span class="r">€${fm(eq)} <span class="mu">${subEq}% / ${T.r_eq}%</span></span></div>`;
  a+=`<div class="arow sub"><span class="l">Bond <small>Gov EUR</small></span><span class="r">€${fm(bo)} <span class="mu">${subBo}% / ${T.r_bo}%</span></span></div>`;
  a+=`<div class="arow"><span class="l">Liquid</span><span class="r">€${fm(liquid)} <span class="mu">${pLiq}% → ${T.liq}%</span> <span class="gap">${gapH(gLiq)}</span></span></div>`;
  a+=`<div class="arow sub"><span class="l">Money Market <small>CSH2</small></span><span class="r">€${fm(mm)} <span class="mu">${subMm}% / ${T.r_mm}%</span></span></div>`;
  a+=`<div class="arow sub"><span class="l">Cash <small>Accounts</small></span><span class="r">€${fm(cash)} <span class="mu">${subCa}% / ${T.r_ca}%</span></span></div>`;
  a+=`<div class="arow"><span class="l">Satellite</span><span class="r">€${fm(sat)} <span class="mu">${pSat}% → ${T.sat}%</span> <span class="gap">${gapH(gSat)}</span></span></div>`;
  $('alloc').innerHTML=a;

  // Actions — numbered steps with explanations
  let acts='<div class="ah">Actions</div>';
  let step=0;

  const surplus=liquid-tLiq;
  const idealEqR=T.r_eq/(T.r_eq+T.r_bo)*100;
  const actualEqR=invested>0?eq/invested*100:0;
  const eqBoDrift=invested>0?Math.abs(actualEqR-idealEqR):0;

  // Step: Sell invested to rebuild liquidity (if invested over AND liquid under)
  if(invested>tInv+500&&surplus<-500){
    step++;
    const sellAmt=Math.round(Math.min(invested-tInv,Math.abs(surplus)));
    const taxCostLiq=Math.round(sellAmt*(cfg.gEq/100/(1+cfg.gEq/100))*0.20);
    acts+=`<div class="act"><span><b>${step}.</b> Rebuild liquidity (invested ${pInv}%, liquid ${pLiq}%)</span><span class="av neg">€${fm(sellAmt)} needed</span></div>`;
    acts+=`<div class="act-note">Option A (free): stop investing, let salary rebuild liquid over time.</div>`;
    acts+=`<div class="act-note">Option B (now): sell €${fm(sellAmt)} from investments. Tax cost approx €${fm(taxCostLiq)}.</div>`;
  }

  // Step: Rebalance Equity/Bond ratio
  if(eqBoDrift>5){
    step++;
    const from=actualEqR>idealEqR?'Equity':'Bond';
    const to=actualEqR>idealEqR?'Bond':'Equity';
    const sellAmt=Math.round(Math.abs(eq-(idealEqR/100)*invested));
    const gPct=actualEqR>idealEqR?cfg.gEq:cfg.gBo;
    const taxCost=Math.round(sellAmt*(gPct/100/(1+gPct/100))*0.20);
    const tranchesToFix=cfg.cap>0?Math.ceil(sellAmt/cfg.cap):99;
    acts+=`<div class="act"><span><b>${step}.</b> Rebalance invested (${Math.round(actualEqR)}/${Math.round(100-actualEqR)} vs ${T.r_eq}/${T.r_bo})</span><span class="av" style="color:#a78bfa">€${fm(sellAmt)} off</span></div>`;
    acts+=`<div class="act-note">Option A (free): invest next ${tranchesToFix} tranches 100% into ${to}. No tax, takes time.</div>`;
    acts+=`<div class="act-note">Option B (now): sell €${fm(sellAmt)} ${from}, buy ${to}. Tax cost approx €${fm(taxCost)}.</div>`;
  }

  // Step: Move Cash → Money Market (if surplus exists and MM below target)
  if(surplus>300){
    const mmNeed=Math.max(0,tMm-mm);
    if(mmNeed>50){
      step++;
      acts+=`<div class="act"><span><b>${step}.</b> Move cash → Money Market</span><span class="av" style="color:#f59e0b">€${fm(Math.round(mmNeed))}</span></div>`;
      acts+=`<div class="act-note">Money Market is ${subMm}% of your liquid (target ${T.r_mm}%). Fill it before investing.</div>`;
    }

    // Step: Invest surplus (capped)
    const investable=Math.max(0,surplus-mmNeed);
    if(investable>=300){
      step++;
      const capMult=cfg.gEq<0?1.5:1;
      const dynCap=Math.round(cfg.cap*capMult);
      const amt=Math.min(investable,dynCap);
      const eqG=Math.max(0,tEq-eq),boG=Math.max(0,tBo-bo);
      const invGap=eqG+boG;
      let toEq,toBo;
      if(invGap>0){toEq=Math.round(amt*eqG/invGap);toBo=amt-toEq}
      else{toEq=Math.round(amt*T.r_eq/100);toBo=amt-toEq}
      acts+=`<div class="act"><span><b>${step}.</b> Invest: €${fm(toEq)} Equity + €${fm(toBo)} Bond</span><span class="av" style="color:#3b82f6">€${fm(amt)}</span></div>`;
      const capNote=capMult>1?`Market is down (${cfg.gEq}%). Cap increased to €${fm(dynCap)} (x1.5). `:'';
      acts+=`<div class="act-note">${capNote}You have €${fm(Math.round(surplus))} excess liquidity.${investable>dynCap?' Remaining €'+fm(Math.round(investable-dynCap))+' for next time.':''}</div>`;
    }
  }else if(surplus<-500&&invested<=tInv){
    // Liquid below target, invested also below — accumulate
    step++;
    acts+=`<div class="act"><span><b>${step}.</b> Accumulate</span><span class="av mu">—</span></div>`;
    acts+=`<div class="act-note">Liquidity is below target (${pLiq}% vs ${T.liq}%). Wait for income before investing.</div>`;
  }

  // Priority 3: MM/Cash rebalance (only when liquid is AT target, not when surplus exists)
  if(surplus>-500&&surplus<=300&&liquid>0){
    const mmIdeal=T.r_mm/100*tLiq;
    const mmOff=mm-mmIdeal;
    if(mmOff>200){
      step++;
      acts+=`<div class="act"><span><b>${step}.</b> Money Market → Cash</span><span class="av mu">€${fm(Math.round(mmOff))}</span></div>`;
      acts+=`<div class="act-note">Money Market is over its ${T.r_mm}% share of liquid. Move excess to cash accounts.</div>`;
    }else if(mmOff<-200&&cash>tCa){
      step++;
      acts+=`<div class="act"><span><b>${step}.</b> Cash → Money Market</span><span class="av" style="color:#f59e0b">€${fm(Math.round(-mmOff))}</span></div>`;
      acts+=`<div class="act-note">Money Market is below its ${T.r_mm}% share. Move cash to earn yield.</div>`;
    }
  }

  // Step: Satellite
  const saGap=Math.max(0,tSat-sat);
  const nBuyTranches=btc.buy.length;
  if(saGap>100){
    step++;
    const perTranche=Math.round(saGap/nBuyTranches);
    let trancheNote=btc.buy.map((p,i)=>`T${i+1}: €${fm(p)} (€${fm(perTranche)})`).join(' | ');
    acts+=`<div class="act"><span><b>${step}.</b> Buy Satellite (BTC)</span><span class="av" style="color:#ef4444">€${fm(perTranche)}/tranche</span></div>`;
    acts+=`<div class="act-note">${trancheNote}</div>`;
    acts+=`<div class="act-note">Total budget: €${fm(Math.round(saGap))}. Buy each tranche when price reaches target.</div>`;
  }else if(sat>tSat+100){
    step++;
    const nSellTranches=btc.sell.length;
    const pctEach=Math.floor(100/nSellTranches);
    let sellNote=btc.sell.map((p,i)=>{
      const pct=i<nSellTranches-1?pctEach:(100-(pctEach*(nSellTranches-1)));
      return `T${i+1}: sell ${pct}% at €${fm(p)}`;
    }).join(' | ');
    acts+=`<div class="act"><span><b>${step}.</b> Satellite — take profit</span><span class="pos">+€${fm(Math.round(sat-tSat))} over target</span></div>`;
    acts+=`<div class="act-note">${sellNote}</div>`;
  }

  if(step===0)acts+=`<div class="act"><span class="mu">All on target. Nothing to do.</span><span></span></div>`;
  $('acts').innerHTML=acts;

  localStorage.setItem('fs',JSON.stringify(s));
}

function openS(){$('sOv').style.display='block'}
function closeS(){$('sOv').style.display='none'}
function upT(){
  T={inv:+$('t_inv').value||0,liq:+$('t_liq').value||0,sat:+$('t_sat').value||0,r_eq:+$('r_eq').value||0,r_bo:+$('r_bo').value||0,r_mm:+$('r_mm').value||0,r_ca:+$('r_ca').value||0};
  $('m1').innerHTML=(T.inv+T.liq+T.sat)!==100?'<span class="neg">'+(T.inv+T.liq+T.sat)+'%</span>':'';
  $('m2').innerHTML=(T.r_eq+T.r_bo)!==100?'<span class="neg">'+(T.r_eq+T.r_bo)+'%</span>':'';
  $('m3').innerHTML=(T.r_mm+T.r_ca)!==100?'<span class="neg">'+(T.r_mm+T.r_ca)+'%</span>':'';
  localStorage.setItem('ft',JSON.stringify(T));calc();
}
function saveCfg(){cfg={cap:+$('cfg_cap').value||2500,gEq:+$('cfg_gEq').value||0,gBo:+$('cfg_gBo').value||0,gSa:+$('cfg_gSa').value||0};localStorage.setItem('fc',JSON.stringify(cfg));calc()}
function saveB(){btc={buy:[+$('btc_b1').value||50000,+$('btc_b2').value||45000,+$('btc_b3').value||38000],sell:[+$('btc_s1').value||80000,+$('btc_s2').value||95000,+$('btc_s3').value||110000]};localStorage.setItem('fb',JSON.stringify(btc));calc()}

function calcW(){
  const need=parseFloat($('w_amt').value)||0;
  if(need<=0){$('wResult').innerHTML='';return}
  const s=getS();
  const eq=s.eq,bo=s.bo,mm=s.mm,cash=s.c1+s.c2+s.c3,sat=s.sa;
  const total=KS.reduce((a,k)=>a+s[k],0);
  const tLiq=T.liq/100*total;

  // Priority: 1. Cash (free), 2. Money Market (free, 1-2 days), 3. Sell Bond (low vol, tax), 4. Sell Equity (high vol, tax), 5. Sell Satellite (speculative, tax)
  let remaining=need;
  let steps=[];

  // 1. Cash above floor
  const cashFloor=T.r_ca/100*(T.liq/100*total);
  const cashAvail=Math.max(0,cash-cashFloor);
  if(remaining>0&&cashAvail>0){
    const take=Math.min(remaining,cashAvail);
    steps.push({src:'Cash (accounts)',amt:take,note:'Instant, no cost, no tax',color:'#6b7280'});
    remaining-=take;
  }

  // 2. Cash below floor (touch emergency)
  if(remaining>0&&cash-cashAvail>0){
    const take=Math.min(remaining,cash-cashAvail);
    steps.push({src:'Cash (emergency reserve)',amt:take,note:'Touches your floor. Rebuild after.',color:'#f59e0b'});
    remaining-=take;
  }

  // 3. Money Market
  if(remaining>0&&mm>0){
    const take=Math.min(remaining,mm);
    steps.push({src:'Money Market (CSH2)',amt:take,note:'Sell order, available in 1-2 days. No tax (money market).',color:'#f59e0b'});
    remaining-=take;
  }

  // 4. Bond
  if(remaining>0&&bo>0){
    const take=Math.min(remaining,bo);
    const tax=Math.round(take*(cfg.gBo/100/(1+cfg.gBo/100))*0.19);
    steps.push({src:'Bond (Gov EUR)',amt:take,note:`Sell order, 1-2 days. Tax on gain: approx €${fm(tax)}.`,color:'#10b981'});
    remaining-=take;
  }

  // 5. Equity
  if(remaining>0&&eq>0){
    const take=Math.min(remaining,eq);
    const tax=Math.round(take*(cfg.gEq/100/(1+cfg.gEq/100))*0.20);
    steps.push({src:'Equity (ACWI)',amt:take,note:`Sell order, 1-2 days. Tax on gain: approx €${fm(tax)}. Avoid if possible.`,color:'#3b82f6'});
    remaining-=take;
  }

  // 6. Satellite
  if(remaining>0&&sat>0){
    const take=Math.min(remaining,sat);
    const tax=Math.round(take*(cfg.gSa/100/(1+cfg.gSa/100))*0.21);
    steps.push({src:'Satellite (BTC)',amt:take,note:`Sell on exchange, 1-3 days. Tax on gain: approx €${fm(tax)}.`,color:'#ef4444'});
    remaining-=take;
  }

  let h='';
  steps.forEach((s,i)=>{
    h+=`<div class="act"><span><b>${i+1}.</b> ${s.src}</span><span class="av" style="color:${s.color}">€${fm(Math.round(s.amt))}</span></div>`;
    h+=`<div class="act-note">${s.note}</div>`;
  });
  if(remaining>0)h+=`<div class="act"><span class="neg">Not enough assets. Short €${fm(Math.round(remaining))}.</span><span></span></div>`;
  $('wResult').innerHTML=h;
}

function saveAll(){
  const s=getS();const total=KS.reduce((a,k)=>a+s[k],0);if(total<=0)return;
  hist=hist.filter(x=>x.d!==new Date().toISOString().slice(0,10));
  hist.push({d:new Date().toISOString().slice(0,10),t:total,s:{...s}});
  hist.sort((a,b)=>a.d.localeCompare(b.d));
  localStorage.setItem('fh',JSON.stringify(hist));rH();
  // Auto-sync to cloud
  const t=localStorage.getItem('ght');
  if(t){fetch('https://api.github.com/gists/'+GID,{method:'PATCH',headers:{'Authorization':'token '+t,'Content-Type':'application/json'},body:JSON.stringify({files:{[GF]:{content:JSON.stringify({s:getS(),T,cfg,btc,h:hist})}}})}).then(r=>{$('ss').textContent=r.ok?'Saved & synced':'Saved locally (sync failed)'}).catch(()=>{$('ss').textContent='Saved locally'})}
  else{$('ss').textContent='Saved locally (set token in Settings to sync)'}
}
function rH(){
  let h='';[...hist].reverse().slice(0,10).forEach(e=>{h+=`<div><span>${e.d}</span><span>€${fm(e.t)}</span></div>`});
  $('hl').innerHTML=h||'<div style="opacity:.15;text-align:center">No data</div>';
}
async function loadFromCloud(){
  const t=localStorage.getItem('ght');if(!t)return;
  try{const r=await fetch('https://api.github.com/gists/'+GID,{headers:{'Authorization':'token '+t}});if(!r.ok)return;
  const g=await r.json();if(!g.files[GF])return;const d=JSON.parse(g.files[GF].content);
  if(d.s)KS.forEach(k=>{$('s_'+k).value=d.s[k]||0});
  if(d.T){T=d.T;$('t_inv').value=T.inv;$('t_liq').value=T.liq;$('t_sat').value=T.sat;$('r_eq').value=T.r_eq;$('r_bo').value=T.r_bo;$('r_mm').value=T.r_mm;$('r_ca').value=T.r_ca}
  if(d.cfg){cfg=d.cfg;$('cfg_cap').value=cfg.cap;$('cfg_gEq').value=cfg.gEq||0;$('cfg_gBo').value=cfg.gBo||0;$('cfg_gSa').value=cfg.gSa||0}
  if(d.btc){btc=d.btc;if(!btc.buy)btc={buy:[50000,45000,38000],sell:[80000,95000,110000]};$('btc_b1').value=btc.buy[0];$('btc_b2').value=btc.buy[1];$('btc_b3').value=btc.buy[2];$('btc_s1').value=btc.sell[0];$('btc_s2').value=btc.sell[1];$('btc_s3').value=btc.sell[2]}
  if(d.h){hist=d.h;localStorage.setItem('fh',JSON.stringify(hist))}
  localStorage.setItem('ft',JSON.stringify(T));localStorage.setItem('fc',JSON.stringify(cfg));localStorage.setItem('fb',JSON.stringify(btc));
  calc();rH()}catch(e){}}

if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>{init();loadFromCloud()});else{init();loadFromCloud()}
</script>
