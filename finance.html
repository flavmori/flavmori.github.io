<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0b0f1a;min-height:100vh;padding:20px;color:#cbd5e1;font-size:13px}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
#lock{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;gap:14px}
#lock input{font-family:'Inter',sans-serif;padding:11px 18px;border-radius:6px;border:1px solid #1e293b;background:#0f172a;color:#f1f5f9;font-size:1em;text-align:center;width:200px}
#lock button{padding:9px 22px;border-radius:6px;border:none;background:#2563eb;color:#fff;font-size:.85em;cursor:pointer;font-weight:500}
#lock .err{color:#ef4444;font-size:.75em}
#app{display:none}
.w{max-width:720px;margin:0 auto}
.total{text-align:center;font-size:2em;font-weight:700;color:#f8fafc;margin:16px 0 4px}
.total-d{text-align:center;font-size:.7em;opacity:.3;margin-bottom:24px}
.sec{margin-bottom:20px}
.sec-h{font-size:.65em;font-weight:600;text-transform:uppercase;letter-spacing:.08em;opacity:.25;margin-bottom:8px}
.irow{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #111827}
.irow:last-child{border:none}
.irow label{font-size:.78em;color:#94a3b8;flex:1}
.irow label small{opacity:.4}
.irow input{font-family:'Inter',sans-serif;width:100px;padding:5px 7px;border-radius:4px;border:1px solid #1e293b;background:#0f172a;color:#f1f5f9;font-size:.82em;text-align:right}
.irow input:focus{outline:none;border-color:#2563eb}
.arow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #111827}
.arow:last-child{border:none}
.arow .l{font-size:.8em;color:#e2e8f0}
.arow .r{font-size:.78em;text-align:right;font-variant-numeric:tabular-nums}
.arow .gap{font-weight:600;font-size:.75em}
.arow.sub{padding-left:16px}
.arow.sub .l{color:#94a3b8;font-size:.75em}
.arow.sub .r{font-size:.72em;opacity:.6}
.pos{color:#10b981}.neg{color:#ef4444}.mu{opacity:.3}
.acts{background:#0f172a;border:1px solid #1e293b;border-radius:8px;padding:14px;margin-bottom:20px}
.acts .ah{font-size:.68em;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#60a5fa;margin-bottom:10px}
.act{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #1e293b;font-size:.8em}
.act:last-child{border:none}
.act .av{font-weight:600;font-variant-numeric:tabular-nums}
.act .icon{width:18px;opacity:.5}
.act-sep{border-top:1px solid #1e293b;margin:8px 0}
.act-note{font-size:.68em;opacity:.3;margin-top:4px}
.btn{padding:7px 14px;border-radius:5px;border:none;color:#fff;font-size:.7em;cursor:pointer;font-weight:500}
.btn-p{background:#2563eb}.btn-s{background:#1e293b}
.foot{display:flex;gap:8px;flex-wrap:wrap}
.sync{font-size:.58em;opacity:.2;text-align:center;margin-top:5px}
.hc{width:100%;height:90px;margin-top:8px}
.hl{max-height:70px;overflow-y:auto;font-size:.62em;margin-top:6px}
.hl div{display:flex;justify-content:space-between;padding:2px 4px;border-bottom:1px solid #111827}
.sov{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);z-index:100;overflow-y:auto;padding:40px 20px}
.sp{max-width:440px;margin:0 auto;background:#0f172a;border:1px solid #1e293b;border-radius:8px;padding:20px}
.sp h2{font-size:.95em;font-weight:600;color:#f8fafc;margin-bottom:14px}
.sp .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.sp label{font-size:.65em;opacity:.4;text-transform:uppercase;display:block;margin-bottom:2px}
.sp input{font-family:'Inter',sans-serif;width:100%;padding:6px 8px;border-radius:4px;border:1px solid #1e293b;background:#0b0f1a;color:#f1f5f9;font-size:.82em}
.sp input:focus{outline:none;border-color:#2563eb}
.sp .msg{font-size:.65em;opacity:.35;margin-top:3px}
.sp .sh{font-size:.68em;opacity:.3;margin:12px 0 6px;text-transform:uppercase}
</style>
</head>
<body>
<div id="lock">
<input type="password" id="pw" placeholder="Password" onkeydown="if(event.key==='Enter')unlock()">
<button onclick="unlock()">Enter</button>
<div class="err" id="err"></div>
</div>
<div id="app"><div class="w">
<div class="total" id="tot">-</div>
<div class="total-d" id="totD"></div>

<div class="sec">
<div class="sec-h">Balances</div>
<div class="irow"><label>Equity <small>ACWI</small></label><input type="number" id="s_eq" step=".01" oninput="calc()"></div>
<div class="irow"><label>Bond <small>Gov EUR</small></label><input type="number" id="s_bo" step=".01" oninput="calc()"></div>
<div class="irow"><label>Money Market <small>CSH2</small></label><input type="number" id="s_mm" step=".01" oninput="calc()"></div>
<div class="irow"><label>Cash <small>Santander</small></label><input type="number" id="s_c1" step=".01" oninput="calc()"></div>
<div class="irow"><label>Cash <small>Trade Republic</small></label><input type="number" id="s_c2" step=".01" oninput="calc()"></div>
<div class="irow"><label>Cash <small>Other</small></label><input type="number" id="s_c3" step=".01" oninput="calc()"></div>
<div class="irow"><label>Satellite <small>BTC</small></label><input type="number" id="s_sa" step=".01" oninput="calc()"></div>
</div>

<div class="sec">
<div class="sec-h">Allocation</div>
<div id="alloc"></div>
</div>

<div class="acts" id="acts"></div>

<div class="sec">
<div class="sec-h">History</div>
<canvas class="hc" id="cv"></canvas>
<div class="hl" id="hl"></div>
</div>

<div class="foot">
<button class="btn btn-p" onclick="save()">Save</button>
<button class="btn btn-s" onclick="toG()">Sync</button>
<button class="btn btn-s" onclick="frG()">Load</button>
<button class="btn btn-s" onclick="openS()">Settings</button>
</div>
<div class="sync" id="ss"></div>
</div></div>

<div class="sov" id="sOv"><div class="sp">
<h2>Settings</h2>
<div class="sh">Allocation (must sum 100%)</div>
<div class="g2">
<div><label>Invested %</label><input type="number" id="t_inv" step="1" oninput="upT()"></div>
<div><label>Liquid %</label><input type="number" id="t_liq" step="1" oninput="upT()"></div>
<div><label>Satellite %</label><input type="number" id="t_sat" step="1" oninput="upT()"></div>
</div>
<div class="msg" id="m1"></div>
<div class="sh">Within Invested (must sum 100%)</div>
<div class="g2">
<div><label>Equity %</label><input type="number" id="r_eq" step="1" oninput="upT()"></div>
<div><label>Bond %</label><input type="number" id="r_bo" step="1" oninput="upT()"></div>
</div>
<div class="msg" id="m2"></div>
<div class="sh">Within Liquid (must sum 100%)</div>
<div class="g2">
<div><label>Money Market %</label><input type="number" id="r_mm" step="1" oninput="upT()"></div>
<div><label>Cash %</label><input type="number" id="r_ca" step="1" oninput="upT()"></div>
</div>
<div class="msg" id="m3"></div>
<div class="sh">Caps</div>
<div class="g2">
<div><label>Investment Cap (€)</label><input type="number" id="cfg_cap" step="100" oninput="saveCfg()"></div>
<div><label>Satellite Cap (€)</label><input type="number" id="cfg_capSa" step="100" oninput="saveCfg()"></div>
</div>
<div class="sh">BTC Trade</div>
<div class="g2">
<div><label>Entry (€)</label><input type="number" id="btc_e" step="1000" oninput="saveB()"></div>
<div><label>Sell (€)</label><input type="number" id="btc_s" step="1000" oninput="saveB()"></div>
</div>
<button class="btn btn-s" style="margin-top:14px" onclick="closeS()">Close</button>
</div></div>

<script>
const GID='17fedcdc8ee90458b9513999b55a4813',GF='finance.json',PW='flavmori2210';
const KS=['eq','bo','mm','c1','c2','c3','sa'];
let T={inv:80,liq:15,sat:5,r_eq:80,r_bo:20,r_mm:60,r_ca:40};
let cfg={cap:2500,capSa:2500};
let btc={entry:40000,sell:95000};
let hist=[];

function unlock(){if($('pw').value===PW){localStorage.setItem('fa','1');show();init()}else $('err').textContent='Wrong'}
function show(){$('lock').style.display='none';$('app').style.display='block'}
function $(id){return document.getElementById(id)}
function J(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function fm(n){return Math.round(n).toLocaleString('it-IT')}
function getS(){let s={};KS.forEach(k=>s[k]=parseFloat($('s_'+k).value)||0);return s}

function init(){
  const s=J('fs')||{};KS.forEach(k=>{if(s[k])$('s_'+k).value=s[k]});
  T=J('ft')||T;cfg=J('fc')||cfg;btc=J('fb')||btc;hist=J('fh')||[];
  $('t_inv').value=T.inv;$('t_liq').value=T.liq;$('t_sat').value=T.sat;
  $('r_eq').value=T.r_eq;$('r_bo').value=T.r_bo;$('r_mm').value=T.r_mm;$('r_ca').value=T.r_ca;
  $('cfg_cap').value=cfg.cap;$('cfg_capSa').value=cfg.capSa;
  $('btc_e').value=btc.entry;$('btc_s').value=btc.sell;
  calc();rH();
}

function calc(){
  const s=getS();
  const total=KS.reduce((a,k)=>a+s[k],0);
  const eq=s.eq,bo=s.bo,mm=s.mm,cash=s.c1+s.c2+s.c3,sat=s.sa;
  const invested=eq+bo,liquid=mm+cash;

  $('tot').textContent=total>0?'€'+fm(total):'-';
  $('totD').textContent=total>0?`Invested €${fm(invested)} · Liquid €${fm(liquid)} · Satellite €${fm(sat)}`:'';

  // Derived targets (€)
  const tInv=T.inv/100*total, tLiq=T.liq/100*total, tSat=T.sat/100*total;
  const tEq=T.r_eq/100*tInv, tBo=T.r_bo/100*tInv;
  const tMm=T.r_mm/100*tLiq, tCa=T.r_ca/100*tLiq;

  // Allocation display
  const pInv=total>0?(invested/total*100).toFixed(0):0;
  const pLiq=total>0?(liquid/total*100).toFixed(0):0;
  const pSat=total>0?(sat/total*100).toFixed(0):0;
  const gInv=tInv-invested,gLiq=tLiq-liquid,gSat=tSat-sat;
  const subEq=invested>0?(eq/invested*100).toFixed(0):0;
  const subBo=invested>0?(bo/invested*100).toFixed(0):0;
  const subMm=liquid>0?(mm/liquid*100).toFixed(0):0;
  const subCa=liquid>0?(cash/liquid*100).toFixed(0):0;

  function gapH(g){return Math.abs(g)<50?'<span class="mu">—</span>':(g>0?`<span class="neg">-€${fm(Math.abs(g))}</span>`:`<span class="pos">+€${fm(-g)}</span>`)}

  let a='';
  a+=`<div class="arow"><span class="l">Invested</span><span class="r">€${fm(invested)} <span class="mu">${pInv}% → ${T.inv}%</span> <span class="gap">${gapH(gInv)}</span></span></div>`;
  a+=`<div class="arow sub"><span class="l">Equity <small>ACWI</small></span><span class="r">€${fm(eq)} <span class="mu">${subEq}% / ${T.r_eq}%</span></span></div>`;
  a+=`<div class="arow sub"><span class="l">Bond <small>Gov EUR</small></span><span class="r">€${fm(bo)} <span class="mu">${subBo}% / ${T.r_bo}%</span></span></div>`;
  a+=`<div class="arow"><span class="l">Liquid</span><span class="r">€${fm(liquid)} <span class="mu">${pLiq}% → ${T.liq}%</span> <span class="gap">${gapH(gLiq)}</span></span></div>`;
  a+=`<div class="arow sub"><span class="l">Money Market <small>CSH2</small></span><span class="r">€${fm(mm)} <span class="mu">${subMm}% / ${T.r_mm}%</span></span></div>`;
  a+=`<div class="arow sub"><span class="l">Cash <small>Accounts</small></span><span class="r">€${fm(cash)} <span class="mu">${subCa}% / ${T.r_ca}%</span></span></div>`;
  a+=`<div class="arow"><span class="l">Satellite</span><span class="r">€${fm(sat)} <span class="mu">${pSat}% → ${T.sat}%</span> <span class="gap">${gapH(gSat)}</span></span></div>`;
  $('alloc').innerHTML=a;

  // Actions
  let acts='<div class="ah">Actions</div>';
  let any=false;

  // Rebalance: Invested over target → sell to rebuild liquidity
  if(invested>tInv+200&&liquid<tLiq-200){
    const sellAmt=Math.min(invested-tInv,tLiq-liquid);
    acts+=`<div class="act"><span>Sell invested → rebuild liquidity</span><span class="av neg">€${fm(Math.round(sellAmt))}</span></div>`;
    any=true;
  }

  // Rebalance: Equity/Bond ratio drift >5pts
  if(invested>0){
    const idealR=T.r_eq/(T.r_eq+T.r_bo)*100;
    const actualR=eq/invested*100;
    if(Math.abs(actualR-idealR)>5){
      const from=actualR>idealR?'Equity':'Bond';
      const to=actualR>idealR?'Bond':'Equity';
      const amt=Math.round(Math.abs(eq-(idealR/100)*invested));
      acts+=`<div class="act"><span>Rebalance: ${from} → ${to}</span><span class="av" style="color:#a78bfa">€${fm(amt)}</span></div>`;
      any=true;
    }
  }

  // Rebalance: MM/Cash ratio within liquid (only when liquid is near target)
  if(liquid>0&&Math.abs(liquid-tLiq)<liquid*0.3){
    const mmIdeal=T.r_mm/(T.r_mm+T.r_ca)*liquid;
    const mmDrift=mm-mmIdeal;
    if(Math.abs(mmDrift)>200){
      if(mmDrift>0)acts+=`<div class="act"><span>Money Market → Cash</span><span class="av mu">€${fm(Math.round(mmDrift))}</span></div>`;
      else acts+=`<div class="act"><span>Cash → Money Market</span><span class="av" style="color:#f59e0b">€${fm(Math.round(-mmDrift))}</span></div>`;
      any=true;
    }
  }

  // Invest: liquid over target
  const surplus=Math.max(0,liquid-tLiq);
  if(surplus>=300){
    // First: if MM is below its target, fill it
    const mmNeed=Math.max(0,tMm-mm);
    if(mmNeed>50&&cash>tCa){
      const moveToMm=Math.min(mmNeed,surplus);
      acts+=`<div class="act"><span>Move to Money Market</span><span class="av" style="color:#f59e0b">€${fm(Math.round(moveToMm))}</span></div>`;
      any=true;
    }
    // Then: invest remainder (capped)
    const investable=Math.max(0,surplus-Math.max(0,mmNeed));
    if(investable>=300){
      if(any)acts+=`<div class="act-sep"></div>`;
      const amt=Math.min(investable,cfg.cap);
      const invGap=Math.max(0,tEq-eq)+Math.max(0,tBo-bo);
      const eqG=Math.max(0,tEq-eq),boG=Math.max(0,tBo-bo);
      let toEq,toBo;
      if(invGap>0){toEq=Math.round(amt*eqG/invGap);toBo=amt-toEq}
      else{toEq=Math.round(amt*T.r_eq/100);toBo=amt-toEq}
      acts+=`<div class="act"><span>Equity <small>ACWI</small></span><span class="av" style="color:#3b82f6">€${fm(toEq)}</span></div>`;
      acts+=`<div class="act"><span>Bond <small>Gov EUR</small></span><span class="av" style="color:#10b981">€${fm(toBo)}</span></div>`;
      if(investable>cfg.cap)acts+=`<div class="act-note">Remaining: €${fm(Math.round(investable-cfg.cap))}</div>`;
      any=true;
    }
  }else if(invested<tInv-200&&surplus<300){
    acts+=`<div class="act"><span class="mu">Not enough surplus. Accumulate.</span><span></span></div>`;
    any=true;
  }

  // Satellite
  if(sat<tSat-50){
    if(any)acts+=`<div class="act-sep"></div>`;
    const saAmt=Math.min(tSat-sat,cfg.capSa);
    acts+=`<div class="act"><span>Satellite <small>BTC at ~€${fm(btc.entry)}</small></span><span class="av" style="color:#ef4444">€${fm(Math.round(saAmt))}</span></div>`;
    any=true;
  }else if(sat>tSat+100){
    if(any)acts+=`<div class="act-sep"></div>`;
    acts+=`<div class="act"><span>Satellite over target — consider profit</span><span class="pos">+€${fm(Math.round(sat-tSat))}</span></div>`;
    any=true;
  }

  if(!any)acts+=`<div class="act"><span class="mu">All on target.</span><span></span></div>`;
  $('acts').innerHTML=acts;

  localStorage.setItem('fs',JSON.stringify(s));
}

function openS(){$('sOv').style.display='block'}
function closeS(){$('sOv').style.display='none'}
function upT(){
  T={inv:+$('t_inv').value||0,liq:+$('t_liq').value||0,sat:+$('t_sat').value||0,r_eq:+$('r_eq').value||0,r_bo:+$('r_bo').value||0,r_mm:+$('r_mm').value||0,r_ca:+$('r_ca').value||0};
  $('m1').innerHTML=(T.inv+T.liq+T.sat)!==100?'<span class="neg">'+(T.inv+T.liq+T.sat)+'%</span>':'';
  $('m2').innerHTML=(T.r_eq+T.r_bo)!==100?'<span class="neg">'+(T.r_eq+T.r_bo)+'%</span>':'';
  $('m3').innerHTML=(T.r_mm+T.r_ca)!==100?'<span class="neg">'+(T.r_mm+T.r_ca)+'%</span>':'';
  localStorage.setItem('ft',JSON.stringify(T));calc();
}
function saveCfg(){cfg={cap:+$('cfg_cap').value||2500,capSa:+$('cfg_capSa').value||2500};localStorage.setItem('fc',JSON.stringify(cfg));calc()}
function saveB(){btc={entry:+$('btc_e').value||40000,sell:+$('btc_s').value||95000};localStorage.setItem('fb',JSON.stringify(btc));calc()}

function save(){
  const s=getS();const total=KS.reduce((a,k)=>a+s[k],0);if(total<=0)return;
  hist=hist.filter(x=>x.d!==new Date().toISOString().slice(0,10));
  hist.push({d:new Date().toISOString().slice(0,10),t:total,s:{...s}});
  hist.sort((a,b)=>a.d.localeCompare(b.d));
  localStorage.setItem('fh',JSON.stringify(hist));rH();$('ss').textContent='Saved';
}
function rH(){
  let h='';[...hist].reverse().forEach(e=>{h+=`<div><span>${e.d}</span><span>€${fm(e.t)}</span></div>`});
  $('hl').innerHTML=h||'<div style="opacity:.15;text-align:center">No data</div>';dC();
}
function dC(){
  const c=$('cv'),x=c.getContext('2d'),d=window.devicePixelRatio||1;
  const W=c.offsetWidth,H=90;c.width=W*d;c.height=H*d;c.style.height=H+'px';x.scale(d,d);x.clearRect(0,0,W,H);
  if(hist.length<2){x.fillStyle='rgba(255,255,255,.08)';x.font='9px Inter';x.textAlign='center';x.fillText('Min 2 snapshots',W/2,H/2);return}
  const vs=hist.map(h=>h.t),mn=Math.min(...vs)*.95,mx=Math.max(...vs)*1.05;
  const p={t:6,b:12,l:32,r:6};
  x.strokeStyle='#1e293b';for(let i=0;i<3;i++){const y=p.t+(H-p.t-p.b)*i/2;x.beginPath();x.moveTo(p.l,y);x.lineTo(W-p.r,y);x.stroke()}
  x.strokeStyle='#2563eb';x.lineWidth=1.5;x.lineJoin='round';x.beginPath();
  hist.forEach((h,i)=>{const px=p.l+i*(W-p.l-p.r)/(hist.length-1);const py=p.t+(1-(h.t-mn)/(mx-mn))*(H-p.t-p.b);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke();
}

function tk(){return localStorage.getItem('ght')||prompt('GitHub Token:')}
async function toG(){const t=tk();if(!t)return;localStorage.setItem('ght',t);try{const r=await fetch('https://api.github.com/gists/'+GID,{method:'PATCH',headers:{'Authorization':'token '+t,'Content-Type':'application/json'},body:JSON.stringify({files:{[GF]:{content:JSON.stringify({s:getS(),T,cfg,btc,h:hist})}}})});$('ss').textContent=r.ok?'Synced':'Err'}catch(e){$('ss').textContent=e.message}}
async function frG(){const t=tk();if(!t)return;localStorage.setItem('ght',t);try{const r=await fetch('https://api.github.com/gists/'+GID,{headers:{'Authorization':'token '+t}});if(!r.ok)return;const g=await r.json();if(!g.files[GF])return;const d=JSON.parse(g.files[GF].content);if(d.s)KS.forEach(k=>{$('s_'+k).value=d.s[k]||0});if(d.T){T=d.T;$('t_inv').value=T.inv;$('t_liq').value=T.liq;$('t_sat').value=T.sat;$('r_eq').value=T.r_eq;$('r_bo').value=T.r_bo;$('r_mm').value=T.r_mm;$('r_ca').value=T.r_ca}if(d.cfg){cfg=d.cfg;$('cfg_cap').value=cfg.cap;$('cfg_capSa').value=cfg.capSa}if(d.btc){btc=d.btc;$('btc_e').value=btc.entry;$('btc_s').value=btc.sell}if(d.h){hist=d.h;localStorage.setItem('fh',JSON.stringify(hist))}localStorage.setItem('ft',JSON.stringify(T));localStorage.setItem('fc',JSON.stringify(cfg));localStorage.setItem('fb',JSON.stringify(btc));calc();rH();$('ss').textContent='Loaded'}catch(e){$('ss').textContent=e.message}}

if(localStorage.getItem('fa')==='1'){show();if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init()}else $('pw').focus();
window.addEventListener('resize',dC);
</script>
</body>
</html>
