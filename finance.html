<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);min-height:100vh;padding:24px;color:#fff;letter-spacing:-.01em}
#lock{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;gap:16px}
#lock h2{font-size:1.8em;opacity:.6}
#lock input{font-family:'Inter',sans-serif;padding:12px 20px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;font-size:1.1em;text-align:center;width:250px}
#lock button{font-family:'Inter',sans-serif;padding:10px 24px;border-radius:12px;border:none;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:1em;cursor:pointer;font-weight:500}
#lock .err{color:#f87171;font-size:.85em}
#app{display:none}
h1{text-align:center;font-size:2em;margin-bottom:6px;font-weight:700;letter-spacing:-.03em;background:linear-gradient(135deg,#667eea,#764ba2,#f093fb);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{text-align:center;opacity:.5;margin-bottom:24px;font-size:.9em}
.container{max-width:880px;margin:0 auto}
.card{background:rgba(255,255,255,.04);border-radius:14px;padding:20px;border:1px solid rgba(255,255,255,.08);margin-bottom:18px}
.card-title{font-size:.85em;font-weight:600;margin-bottom:14px;text-transform:uppercase;letter-spacing:.04em;opacity:.6}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:600px){.grid2,.grid3{grid-template-columns:1fr 1fr}}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.75em;opacity:.5;font-weight:500}
.field input{font-family:'Inter',sans-serif;padding:10px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:#fff;font-size:.95em;width:100%}
.field input:focus{outline:none;border-color:#764ba2}
.total-bar{text-align:center;padding:20px;background:rgba(255,255,255,.06);border-radius:12px;margin-bottom:18px;border:1px solid rgba(255,255,255,.1)}
.total-bar .big{font-size:2.2em;font-weight:700}
.total-bar .sub{opacity:.5;font-size:.82em;margin-top:8px;line-height:1.7}
.total-bar .frozen{margin-top:10px;font-size:.78em;padding:6px 12px;display:inline-block;border-radius:6px;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.15);color:#f59e0b}
.bucket{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:10px;margin-bottom:6px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.05)}
.bucket .lbl{width:120px;font-size:.82em;font-weight:500;line-height:1.3}
.bucket .lbl small{display:block;font-weight:400;opacity:.4;font-size:.85em}
.bucket .bar-wrap{flex:1;height:20px;background:rgba(255,255,255,.07);border-radius:5px;position:relative;overflow:hidden}
.bucket .bar-fill{height:100%;border-radius:5px;position:absolute;top:0;left:0;transition:width .3s}
.bucket .bar-marker{position:absolute;top:0;height:100%;width:2px;background:rgba(255,255,255,.5)}
.bucket .bar-pct{position:absolute;top:50%;right:6px;transform:translateY(-50%);font-size:.7em;font-weight:600}
.bucket .val{width:150px;text-align:right;font-size:.78em;line-height:1.4;font-variant-numeric:tabular-nums}
.pos{color:#34d399}.neg{color:#f87171}.muted{opacity:.4}
.alert-box{padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:.82em;display:none}
.alert-box.show{display:block}
.alert-warn{background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.2);color:#fbbf24}
.alert-ok{background:rgba(52,211,153,.06);border:1px solid rgba(52,211,153,.2);color:#34d399}
.action-box{padding:18px;border-radius:12px;margin-bottom:18px;border:1px solid rgba(102,126,234,.2);background:rgba(102,126,234,.05)}
.action-box .phase{font-size:.78em;opacity:.5;margin-bottom:6px}
.action-box .title{font-size:.95em;font-weight:600;margin-bottom:14px}
.action-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:.88em}
.action-row:last-child{border:none}
.action-row .v{font-weight:600;font-variant-numeric:tabular-nums}
.action-box .after{margin-top:14px;font-size:.78em;opacity:.5;line-height:1.5}
.config-row{display:flex;gap:12px;margin-bottom:14px;align-items:end}
.config-row .field{flex:1}
.btc-box{padding:18px;border-radius:12px;margin-bottom:18px;border:1px solid rgba(245,158,11,.2);background:rgba(245,158,11,.03)}
.btc-box .title{font-size:.9em;font-weight:600;margin-bottom:10px;color:#f59e0b}
.btc-box .status{font-size:.85em;line-height:1.6;margin-bottom:8px}
.btc-box .note{font-size:.75em;opacity:.4;line-height:1.5}
.btn{font-family:'Inter',sans-serif;padding:9px 18px;border-radius:8px;border:none;color:#fff;font-size:.82em;cursor:pointer;font-weight:500}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,#667eea,#764ba2)}
.btn-secondary{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.history-chart{width:100%;height:140px;position:relative;margin-top:10px}
.history-list{max-height:140px;overflow-y:auto;font-size:.75em;margin-top:10px}
.history-list .entry{display:flex;justify-content:space-between;padding:4px 6px;border-bottom:1px solid rgba(255,255,255,.04)}
.sync-status{font-size:.7em;opacity:.4;text-align:center;margin-top:6px}
.nav-link{position:fixed;top:14px;left:14px;font-size:.8em;opacity:.4;text-decoration:none;color:#fff}
.nav-link:hover{opacity:.8}
</style>
</head>
<body>
<a href="index.html" class="nav-link">< calendario</a>
<div id="lock">
<h2>-</h2>
<input type="password" id="pw" placeholder="Password" onkeydown="if(event.key==='Enter')unlock()">
<button onclick="unlock()">Entra</button>
<div class="err" id="err"></div>
</div>
<div id="app"><div class="container">
<h1>Finance Rebalancer</h1>
<p class="subtitle">Aggiorna saldi. Vedi dove sei. Investi smart.</p>

<div class="total-bar">
<div class="big" id="tot">-</div>
<div class="sub" id="totSub"></div>
<div class="frozen" id="frozenLabel" style="display:none"></div>
</div>
<div class="alert-box" id="alert"></div>

<div class="card">
<div class="card-title">Saldi attuali</div>
<div class="grid3">
<div class="field"><label>ACWI</label><input type="number" id="s_acwi" step=".01" oninput="calc()"></div>
<div class="field"><label>Gov Bond</label><input type="number" id="s_gov" step=".01" oninput="calc()"></div>
<div class="field"><label>CSH2</label><input type="number" id="s_csh2" step=".01" oninput="calc()"></div>
<div class="field"><label>Santander</label><input type="number" id="s_sant" step=".01" oninput="calc()"></div>
<div class="field"><label>Saldo TR Cash</label><input type="number" id="s_trcash" step=".01" oninput="calc()"></div>
<div class="field"><label>BTC (0 se non comprato)</label><input type="number" id="s_btc" step=".01" oninput="calc()"></div>
</div>
</div>

<div class="card">
<div class="card-title">Allocazione vs Target</div>
<div id="buckets"></div>
</div>

<div class="action-box" id="actionBox">
<div class="config-row">
<div class="field"><label>Tranche bulk</label><input type="number" id="cfg_bulk" value="2500" step="100" oninput="calc()"></div>
<div class="field"><label>PAC mensile (a regime)</label><input type="number" id="cfg_pac" value="400" step="50" oninput="calc()"></div>
</div>
<div id="actionContent"></div>
</div>

<div class="btc-box" id="btcBox"></div>

<div class="card">
<div class="card-title">Salva</div>
<div class="actions">
<button class="btn btn-primary" onclick="save()">Snapshot</button>
<button class="btn btn-secondary" onclick="toGist()">Sync cloud</button>
<button class="btn btn-secondary" onclick="fromGist()">Carica cloud</button>
</div>
<div class="sync-status" id="ss"></div>
</div>

<div class="card">
<div class="card-title">Storico</div>
<div class="history-chart"><canvas id="cv"></canvas></div>
<div class="history-list" id="hl"></div>
</div>
</div></div>

<script>
const GIST_ID='17fedcdc8ee90458b9513999b55a4813',GF='finance.json',PW='flavmori2210';
const KS=['acwi','gov','csh2','sant','trcash','btc'];
const T={investito:79,liquidita:14,buffer:7};
let hist=[],btcConf={budget:5000,entry:40000,sell:95000};

function unlock(){if(document.getElementById('pw').value===PW){localStorage.setItem('fa','1');show();init()}else $('err').textContent='No'}
function show(){$('lock').style.display='none';$('app').style.display='block'}
function $(id){return document.getElementById(id)}
function J(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function fm(n){return Math.round(n).toLocaleString('it-IT')}
function getS(){let s={};KS.forEach(k=>s[k]=parseFloat($(('s_'+k)).value)||0);return s}

function init(){
  let s=J('fin_s')||{};KS.forEach(k=>{if(s[k])$('s_'+k).value=s[k]});
  btcConf=J('fin_btc')||btcConf;
  let cfg=J('fin_cfg')||{};
  if(cfg.bulk)$('cfg_bulk').value=cfg.bulk;
  if(cfg.pac)$('cfg_pac').value=cfg.pac;
  hist=J('fin_h')||[];
  calc();renderHist();
}

function calc(){
  const s=getS();
  const total=KS.reduce((a,k)=>a+s[k],0);
  const btcOwned=s.btc;
  const btcRes=btcOwned>0?0:Math.min(btcConf.budget,s.trcash);
  const active=total-btcRes-btcOwned;
  const investito=s.acwi+s.gov;
  const liquidita=s.csh2+s.sant;
  const buffer=s.trcash-btcRes;

  // Total display
  $('tot').textContent=total>0?'€'+fm(total):'-';
  if(total>0){
    const r=investito>0?Math.round(s.acwi/investito*100)+'/'+Math.round(s.gov/investito*100):'—';
    $('totSub').innerHTML=`Investito €${fm(investito)} (ratio ${r}) · Liquido €${fm(liquidita)} · Buffer €${fm(buffer)}`;
  }
  // Frozen BTC label
  const fl=$('frozenLabel');
  if(btcRes>0){fl.style.display='inline-block';fl.textContent=`€${fm(btcRes)} congelati per BTC (esclusi dai target)`}
  else if(btcOwned>0){fl.style.display='inline-block';fl.textContent=`€${fm(btcOwned)} in BTC (trade attivo, escluso dai target)`}
  else{fl.style.display='none'}

  // Alert
  const liqPct=active>0?liquidita/active*100:0;
  const al=$('alert');
  if(active>0&&liqPct<T.liquidita){al.className='alert-box alert-warn show';al.textContent=`Liquidita ${liqPct.toFixed(1)}% — sotto target ${T.liquidita}%. Rallenta.`}
  else if(active>0){al.className='alert-box alert-ok show';al.textContent=`Liquidita ${liqPct.toFixed(1)}% (target ${T.liquidita}%) — OK`}
  else al.className='alert-box';

  // Buckets
  const bks=[
    {name:'Investito',sub:'ACWI+Gov 80/20',val:investito,tgt:T.investito,color:'#667eea'},
    {name:'Liquidita',sub:'CSH2+Santander',val:liquidita,tgt:T.liquidita,color:'#fbbf24'},
    {name:'Buffer',sub:'TR cash libero',val:buffer,tgt:T.buffer,color:'#94a3b8'},
  ];
  let bhtml='';
  bks.forEach(b=>{
    const pct=active>0?b.val/active*100:0;
    const tgtE=b.tgt/100*active;
    const gap=tgtE-b.val;
    const mx=Math.max(pct,b.tgt,1);
    const bw=Math.min(pct/mx*100,100);
    const mp=b.tgt/mx*100;
    const gt=Math.abs(gap)<50?'<span class="muted">OK</span>':(gap>0?`<span class="neg">-€${fm(Math.abs(gap))}</span>`:`<span class="pos">+€${fm(-gap)} sopra</span>`);
    bhtml+=`<div class="bucket"><div class="lbl">${b.name}<small>${b.sub}</small></div><div class="bar-wrap"><div class="bar-fill" style="width:${bw}%;background:${b.color};opacity:.5"></div><div class="bar-marker" style="left:${mp}%"></div><div class="bar-pct">${pct.toFixed(0)}%/${b.tgt}%</div></div><div class="val">${gt}<br><span class="muted">€${fm(b.val)} / €${fm(tgtE)}</span></div></div>`;
  });
  $('buckets').innerHTML=bhtml;

  // Action — auto phase
  const bulkAmt=parseFloat($('cfg_bulk').value)||2500;
  const pacAmt=parseFloat($('cfg_pac').value)||400;
  const bufferTarget=T.buffer/100*active;
  const available=Math.max(0,buffer-bufferTarget);
  const isBulk=available>=bulkAmt;
  const amt=isBulk?bulkAmt:pacAmt;
  const phase=isBulk?`Fase bulk — €${fm(available)} da allocare (~${Math.ceil(available/bulkAmt)} tranches rimaste)`:`A regime — surplus mensile`;

  // Split based on gaps
  const investTarget=T.investito/100*active;
  const liqTarget=T.liquidita/100*active;
  const investGap=Math.max(0,investTarget-investito);
  const liqGap=Math.max(0,liqTarget-liquidita);
  const totalGap=investGap+liqGap;

  let toInvest=amt,toLiq=0;
  if(totalGap>0&&liqGap>0){toLiq=Math.min(amt,Math.round(amt*liqGap/totalGap));toInvest=amt-toLiq}
  if(liqGap<=0){toInvest=amt;toLiq=0}

  // Invest split: ratio-aware
  const acwiTgt=0.80*investTarget;
  const govTgt=0.20*investTarget;
  const acwiGap=Math.max(0,acwiTgt-s.acwi);
  const govGap=Math.max(0,govTgt-s.gov);
  const ig=acwiGap+govGap;
  let toA,toG;
  if(ig>0){toA=Math.round(toInvest*acwiGap/ig);toG=toInvest-toA}
  else{toA=Math.round(toInvest*0.80);toG=toInvest-toA}

  let ahtml=`<div class="phase">${phase}</div><div class="title">Prossima tranche: €${fm(amt)}</div>`;
  if(toA>0)ahtml+=`<div class="action-row"><span>ACWI</span><span class="v" style="color:#667eea">€${fm(toA)}</span></div>`;
  if(toG>0)ahtml+=`<div class="action-row"><span>Gov Bond</span><span class="v" style="color:#34d399">€${fm(toG)}</span></div>`;
  if(toLiq>0)ahtml+=`<div class="action-row"><span>CSH2 (liquidita)</span><span class="v" style="color:#fbbf24">€${fm(toLiq)}</span></div>`;

  const newInv=investito+toInvest;
  const newR=newInv>0?Math.round((s.acwi+toA)/newInv*100)+'/'+Math.round((s.gov+toG)/newInv*100):'—';
  ahtml+=`<div class="after">Dopo: investito ${active>0?((newInv/active)*100).toFixed(1):'0'}% (ratio ${newR})`;
  if(isBulk)ahtml+=` · buffer residuo €${fm(available-amt)}`;
  ahtml+=`</div>`;
  $('actionContent').innerHTML=ahtml;

  // BTC
  let bh='';
  if(btcOwned>0){
    const gain=(btcConf.sell/btcConf.entry-1)*btcOwned;
    bh=`<div class="title">Trade attivo</div><div class="status">€${fm(btcOwned)} in BTC. Target sell: €${fm(btcConf.sell)}.<br>Guadagno potenziale: €${fm(gain)} lordo (tasse ~21%).</div><div class="note">Quando vendi, sposta tutto in ACWI e rimetti BTC a 0.</div>`;
  }else if(btcRes>0){
    bh=`<div class="title">In attesa — €${fm(btcRes)} riservati</div><div class="status">Congelati nel saldo TR. Non disponibili per investire.<br>Compra quando BTC tocca ~€${fm(btcConf.entry)}. Alert su Trade Republic.</div><div class="note">Se non scende entro fine estate, reinvesti quei €${fm(btcRes)} in ACWI.</div>`;
  }else{
    bh=`<div class="title">Nessun trade attivo</div><div class="note">Budget BTC: €${fm(btcConf.budget)} · Entry: €${fm(btcConf.entry)} · Sell: €${fm(btcConf.sell)}</div>`;
  }
  $('btcBox').innerHTML=bh;

  // Persist
  localStorage.setItem('fin_s',JSON.stringify(s));
  localStorage.setItem('fin_btc',JSON.stringify(btcConf));
  localStorage.setItem('fin_cfg',JSON.stringify({bulk:bulkAmt,pac:pacAmt}));
}

function save(){
  const s=getS();const total=KS.reduce((a,k)=>a+s[k],0);if(total<=0)return;
  const e={d:new Date().toISOString().slice(0,10),t:total,s:{...s}};
  hist=hist.filter(h=>h.d!==e.d);hist.push(e);hist.sort((a,b)=>a.d.localeCompare(b.d));
  localStorage.setItem('fin_h',JSON.stringify(hist));renderHist();
  $('ss').textContent='Salvato '+new Date().toLocaleTimeString();
}

function renderHist(){
  let h='';[...hist].reverse().forEach(e=>{h+=`<div class="entry"><span>${e.d}</span><span>€${fm(e.t)}</span></div>`});
  $('hl').innerHTML=h||'<div class="muted" style="padding:6px;text-align:center">Nessun dato</div>';
  drawChart();
}

function drawChart(){
  const c=$('cv'),ctx=c.getContext('2d'),dpr=window.devicePixelRatio||1;
  const W=c.parentElement.getBoundingClientRect().width,H=140;
  c.width=W*dpr;c.height=H*dpr;ctx.scale(dpr,dpr);ctx.clearRect(0,0,W,H);
  if(hist.length<2){ctx.fillStyle='rgba(255,255,255,.2)';ctx.font='11px Inter';ctx.textAlign='center';ctx.fillText('Min 2 snapshot',W/2,H/2);return}
  const vs=hist.map(h=>h.t),mn=Math.min(...vs)*.95,mx=Math.max(...vs)*1.05;
  const p={t:14,b:20,l:42,r:12};
  ctx.strokeStyle='rgba(255,255,255,.05)';
  for(let i=0;i<4;i++){const y=p.t+(H-p.t-p.b)*i/3;ctx.beginPath();ctx.moveTo(p.l,y);ctx.lineTo(W-p.r,y);ctx.stroke();ctx.fillStyle='rgba(255,255,255,.25)';ctx.font='8px Inter';ctx.textAlign='right';ctx.fillText('€'+fm(mx-(mx-mn)*i/3),p.l-4,y+3)}
  const g=ctx.createLinearGradient(0,0,W,0);g.addColorStop(0,'#667eea');g.addColorStop(1,'#764ba2');
  ctx.strokeStyle=g;ctx.lineWidth=2;ctx.lineJoin='round';ctx.beginPath();
  hist.forEach((h,i)=>{const x=p.l+i*(W-p.l-p.r)/(hist.length-1);const y=p.t+(1-(h.t-mn)/(mx-mn))*(H-p.t-p.b);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();
  hist.forEach((h,i)=>{const x=p.l+i*(W-p.l-p.r)/(hist.length-1);const y=p.t+(1-(h.t-mn)/(mx-mn))*(H-p.t-p.b);ctx.beginPath();ctx.arc(x,y,2.5,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill()});
}

function tk(){return localStorage.getItem('ght')||prompt('GitHub Token:')}
async function toGist(){
  const t=tk();if(!t)return;localStorage.setItem('ght',t);
  const d={s:getS(),btc:btcConf,cfg:{bulk:+$('cfg_bulk').value,pac:+$('cfg_pac').value},h:hist,u:new Date().toISOString()};
  try{const r=await fetch('https://api.github.com/gists/'+GIST_ID,{method:'PATCH',headers:{'Authorization':'token '+t,'Content-Type':'application/json'},body:JSON.stringify({files:{[GF]:{content:JSON.stringify(d)}}})});$('ss').textContent=r.ok?'Cloud OK':'Err '+r.status}catch(e){$('ss').textContent=e.message}
}
async function fromGist(){
  const t=tk();if(!t)return;localStorage.setItem('ght',t);
  try{const r=await fetch('https://api.github.com/gists/'+GIST_ID,{headers:{'Authorization':'token '+t}});if(!r.ok)return;
  const g=await r.json();if(!g.files[GF])return;const d=JSON.parse(g.files[GF].content);
  if(d.s)KS.forEach(k=>{$('s_'+k).value=d.s[k]||0});
  if(d.btc)btcConf=d.btc;
  if(d.cfg){$('cfg_bulk').value=d.cfg.bulk||2500;$('cfg_pac').value=d.cfg.pac||400}
  if(d.h){hist=d.h;localStorage.setItem('fin_h',JSON.stringify(hist))}
  calc();renderHist();$('ss').textContent='Caricato'}catch(e){$('ss').textContent=e.message}
}

if(localStorage.getItem('fa')==='1'){show();if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init()}else $('pw').focus();
window.addEventListener('resize',()=>drawChart());
</script>
</body>
</html>
