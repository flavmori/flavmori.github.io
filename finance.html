<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0b0f1a;min-height:100vh;padding:20px;color:#cbd5e1;font-size:13px}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}

.w{max-width:720px;margin:0 auto}
.total{text-align:center;font-size:2em;font-weight:700;color:#f8fafc;margin:16px 0 4px}
.total-d{text-align:center;font-size:.7em;opacity:.3;margin-bottom:24px}
.sec{margin-bottom:20px}
.sec-h{font-size:.65em;font-weight:600;text-transform:uppercase;letter-spacing:.08em;opacity:.25;margin-bottom:8px}
.irow{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #111827}
.irow:last-child{border:none}
.irow label{font-size:.78em;color:#94a3b8;flex:1}
.irow label small{opacity:.4}
.irow input{font-family:'Inter',sans-serif;width:7ch;min-width:50px;max-width:90px;padding:5px 6px;border-radius:4px;border:1px solid #1e293b;background:#0f172a;color:#f1f5f9;font-size:.78em;text-align:right}
.irow::after{content:'€';font-size:.72em;opacity:.3;margin-left:4px}
.irow input:focus{outline:none;border-color:#2563eb}
.arow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #111827}
.arow:last-child{border:none}
.arow .l{font-size:.8em;color:#e2e8f0}
.arow .r{font-size:.78em;text-align:right;font-variant-numeric:tabular-nums}
.arow .gap{font-weight:600;font-size:.75em}
.arow.sub{padding-left:16px}
.arow.sub .l{color:#94a3b8;font-size:.75em}
.arow.sub .r{font-size:.72em;opacity:.6}
.pos{color:#10b981}.neg{color:#ef4444}.mu{opacity:.3}
.acts{background:#0f172a;border:1px solid #1e293b;border-radius:8px;padding:14px;margin-bottom:20px}
.acts .ah{font-size:.68em;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#60a5fa;margin-bottom:10px}
.act{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #1e293b;font-size:.8em}
.act:last-child{border:none}
.act .av{font-weight:600;font-variant-numeric:tabular-nums}
.act .icon{width:18px;opacity:.5}
.act-sep{border-top:1px solid #1e293b;margin:8px 0}
.act-note{font-size:.68em;opacity:.3;margin-top:4px}
.btn{padding:7px 14px;border-radius:5px;border:none;color:#fff;font-size:.7em;cursor:pointer;font-weight:500}
.btn-p{background:#2563eb}.btn-s{background:#1e293b}
.foot{display:flex;gap:8px;flex-wrap:wrap}
.sync{font-size:.58em;opacity:.2;text-align:center;margin-top:5px}
.hl{max-height:100px;overflow-y:auto;font-size:.62em}
.hl div{display:flex;justify-content:space-between;padding:2px 4px;border-bottom:1px solid #111827}
.donut{width:140px;height:140px;border-radius:50%;margin:0 auto 10px}
.donut-legend{font-size:.68em;line-height:1.8}
.donut-legend span{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.risk-bar{height:6px;background:#1e293b;border-radius:3px;margin:8px 0;position:relative}
.risk-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#10b981,#f59e0b,#ef4444)}
.risk-dot{width:10px;height:10px;border-radius:50%;background:#f8fafc;border:2px solid #0b0f1a;position:absolute;top:-2px;transform:translateX(-50%)}
.risk-labels{display:flex;justify-content:space-between;font-size:.6em;opacity:.3}
.risk-val{font-size:.75em;margin-top:8px;line-height:1.7}
.proj-btn{padding:5px 10px;border-radius:4px;border:1px solid #1e293b;background:transparent;color:#94a3b8;font-size:.7em;cursor:pointer;font-family:'Inter',sans-serif}
.proj-btn.active{background:#2563eb;border-color:#2563eb;color:#fff}
.proj-info{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px;font-size:.72em}
.proj-card{padding:8px;border-radius:6px;border:1px solid #1e293b;text-align:center}
.proj-card .pv{font-size:1.1em;font-weight:600;color:#f8fafc;margin:4px 0}
.proj-card .pl{opacity:.4;font-size:.85em}
.sov{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);z-index:100;overflow-y:auto;padding:40px 20px}
.sp{max-width:440px;margin:0 auto;background:#0f172a;border:1px solid #1e293b;border-radius:8px;padding:20px}
.sp h2{font-size:.95em;font-weight:600;color:#f8fafc;margin-bottom:14px}
.sp .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.sp label{font-size:.65em;opacity:.4;text-transform:uppercase;display:block;margin-bottom:2px}
.sp input{font-family:'Inter',sans-serif;width:100%;padding:6px 8px;border-radius:4px;border:1px solid #1e293b;background:#0b0f1a;color:#f1f5f9;font-size:.82em}
.sp input:focus{outline:none;border-color:#2563eb}
.sp .msg{font-size:.65em;opacity:.35;margin-top:3px}
.sp .sh{font-size:.68em;opacity:.3;margin:12px 0 6px;text-transform:uppercase}
</style>
</head>
<body>

<div id="app" style="display:block"><div class="w">
<div class="total" id="tot">-</div>
<div class="total-d" id="totD"></div>

<div class="sec">
<div class="sec-h">Balances</div>
<div style="font-size:.6em;opacity:.25;text-transform:uppercase;letter-spacing:.05em;margin:8px 0 4px;padding-top:4px">Invested</div>
<div class="irow"><label>Equity <small>ACWI</small></label><input type="text" id="s_eq" inputmode="decimal" oninput="calc()" onfocus="if(this.dataset.raw)this.value=this.dataset.raw;else this.value=this.value.replace(/\./g,'')" onblur="this.dataset.raw=this.value;fmInput(this)"></div>
<div class="irow"><label>Bond <small>Gov EUR</small></label><input type="text" id="s_bo" inputmode="decimal" oninput="calc()" onfocus="if(this.dataset.raw)this.value=this.dataset.raw;else this.value=this.value.replace(/\./g,'')" onblur="this.dataset.raw=this.value;fmInput(this)"></div>
<div style="font-size:.6em;opacity:.25;text-transform:uppercase;letter-spacing:.05em;margin:10px 0 4px;padding-top:6px;border-top:1px solid #1e293b">Liquid</div>
<div class="irow"><label>Money Market <small>CSH2</small></label><input type="text" id="s_mm" inputmode="decimal" oninput="calc()" onfocus="if(this.dataset.raw)this.value=this.dataset.raw;else this.value=this.value.replace(/\./g,'')" onblur="this.dataset.raw=this.value;fmInput(this)"></div>
<div class="irow"><label>Cash <small>Santander</small></label><input type="text" id="s_c1" inputmode="decimal" oninput="calc()" onfocus="if(this.dataset.raw)this.value=this.dataset.raw;else this.value=this.value.replace(/\./g,'')" onblur="this.dataset.raw=this.value;fmInput(this)"></div>
<div class="irow"><label>Cash <small>Trade Republic</small></label><input type="text" id="s_c2" inputmode="decimal" oninput="calc()" onfocus="if(this.dataset.raw)this.value=this.dataset.raw;else this.value=this.value.replace(/\./g,'')" onblur="this.dataset.raw=this.value;fmInput(this)"></div>
<div class="irow"><label>Cash <small>Other</small></label><input type="text" id="s_c3" inputmode="decimal" oninput="calc()" onfocus="if(this.dataset.raw)this.value=this.dataset.raw;else this.value=this.value.replace(/\./g,'')" onblur="this.dataset.raw=this.value;fmInput(this)"></div>
<div style="font-size:.6em;opacity:.25;text-transform:uppercase;letter-spacing:.05em;margin:10px 0 4px;padding-top:6px;border-top:1px solid #1e293b">Satellite</div>
<div class="irow"><label>Satellite <small>BTC</small></label><input type="text" id="s_sa" inputmode="decimal" oninput="calc()" onfocus="if(this.dataset.raw)this.value=this.dataset.raw;else this.value=this.value.replace(/\./g,'')" onblur="this.dataset.raw=this.value;fmInput(this)"></div>
</div>

<div class="sec">
<div class="sec-h">Allocation</div>
<div id="alloc"></div>
</div>

<div class="acts" id="acts"></div>

<div class="sec">
<div class="sec-h">I need cash</div>
<div class="irow"><label>How much do you need?</label><input type="number" id="w_amt" step="100" oninput="calcW()"></div>
<div id="wResult"></div>
</div>

<div class="sec" style="display:flex;gap:16px;flex-wrap:wrap">
<div id="donut" style="flex:1;min-width:180px"></div>

<div id="projInfo" class="proj-info"></div>
</div>

<div class="sec">
<div class="sec-h" style="cursor:pointer" onclick="$('hl').style.maxHeight=$('hl').style.maxHeight==='none'?'60px':'none'">Snapshots</div>
<div class="hl" id="hl" style="max-height:60px;overflow:hidden"></div>

</div>

<div class="foot">
<button class="btn btn-p" onclick="saveAll()">Save</button>
<button class="btn btn-s" onclick="openS()">Settings</button>
<button class="btn btn-s" id="compactBtn" onclick="togCompact()">Precise</button>

<h2>Settings</h2>
<div class="sh">Allocation (must sum 100%)</div>
<div class="g2">
<div><label>Invested %</label><input type="number" id="t_inv" step="1" oninput="upT()"></div>
<div><label>Liquid %</label><input type="number" id="t_liq" step="1" oninput="upT()"></div>

</div>

</div>

<div><label>Equity gain %</label><input type="number" id="cfg_gEq" step="1" oninput="saveCfg()"></div>
<div><label>Bond gain %</label><input type="number" id="cfg_gBo" step="1" oninput="saveCfg()"></div>

</div>

</div>

<div><label>Sell 2 (€)</label><input type="number" id="btc_s2" step="1000" oninput="saveB()"></div>

</div>

<div><label>GitHub Token (for cross-device sync)</label><input type="text" id="ghToken" style="width:100%;margin-top:4px" onchange="localStorage.setItem('ght',this.value)" placeholder="ghp_..."></div>
<button class="btn btn-s" style="margin-top:14px" onclick="closeS()">Close</button>
</div></div>

<script>
const GID='17fedcdc8ee90458b9513999b55a4813',GF='finance.json';
const KS=['eq','bo','mm','c1','c2','c3','sa'];
let T={inv:80,liq:15,sat:5,r_eq:80,r_bo:20,r_mm:60,r_ca:40};
let cfg={cap:2500,gEq:1.63,gBo:0.31,gSa:0,mc:400};
let btc={buy:[42000,35000,28000],sell:[80000,95000,110000]};
let hist=[];

function $(id){return document.getElementById(id)}
function J(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function fm(n){if(compact){if(Math.abs(n)>=1000000)return(n/1000000).toFixed(1)+'M';if(Math.abs(n)>=1000)return Math.round(n/1000)+'K';return String(Math.round(n))}const s=Math.round(n).toString();return s.replace(/\B(?=(\d{3})+(?!\d))/g,'.')}
function fmA(n){const s=Math.round(n).toString();return s.replace(/\B(?=(\d{3})+(?!\d))/g,'.')}
let compact=true;
function fmC(n){if(!n||n===0)return'';return'\u20AC'+fm(n)}
function fmP(n){return compact?Math.round(n)+'%':n.toFixed(1)+'%'}
function togCompact(){compact=!compact;$('compactBtn').textContent=compact?'Precise':'Compact';calc()}
function getS(){let s={};KS.forEach(k=>{const el=$('s_'+k);const raw=el.dataset.raw;if(raw)s[k]=parseFloat(raw)||0;else{let v=el.value.trim();if(v.endsWith('M'))s[k]=parseFloat(v)*1000000;else if(v.endsWith('K'))s[k]=parseFloat(v)*1000;else s[k]=parseFloat(v.replace(/\./g,'').replace(',','.'))||0}});return s}
function fmInput(el){const raw=parseFloat(el.dataset.raw||el.value.replace(/[\.KM]/g,''))||0;if(raw>0&&el!==document.activeElement){el.dataset.raw=raw;if(compact){if(raw>=1000000)el.value=(raw/1000000).toFixed(1)+'M';else if(raw>=1000){const k=raw/1000;el.value=(k%1===0?k.toFixed(0):k.toFixed(1))+'K'}else el.value=String(Math.round(raw))}else{const s=Math.round(raw).toString();el.value=s.replace(/\B(?=(\d{3})+(?!\d))/g,'.')}}else if(raw===0){el.value='';el.dataset.raw=''}el.style.width=Math.max(4,el.value.length+1)+'ch'}
function autoSize(){document.querySelectorAll('.irow input[id^="s_"]').forEach(fmInput)}

function init(){
  const s=J('fs')||{};KS.forEach(k=>{const el=$('s_'+k);el.dataset.raw=s[k]||'';el.value=s[k]?String(s[k]):'';fmInput(el)});
  T=J('ft')||T;cfg=J('fc')||cfg;btc=J('fb')||btc;hist=J('fh')||[];
  if(!btc.buy)btc={buy:[50000,45000,38000],sell:[80000,95000,110000]};
  $('t_inv').value=T.inv;$('t_liq').value=T.liq;$('t_sat').value=T.sat;
  $('r_eq').value=T.r_eq;$('r_bo').value=T.r_bo;$('r_mm').value=T.r_mm;$('r_ca').value=T.r_ca;
  $('cfg_cap').value=cfg.cap;
  $('cfg_mc').value=cfg.mc||400;
  $('cfg_gEq').value=cfg.gEq||0;$('cfg_gBo').value=cfg.gBo||0;$('cfg_gSa').value=cfg.gSa||0;
  $('btc_b1').value=btc.buy?btc.buy[0]:50000;$('btc_b2').value=btc.buy?btc.buy[1]:45000;$('btc_b3').value=btc.buy?btc.buy[2]:38000;
  $('btc_s1').value=btc.sell?btc.sell[0]:80000;$('btc_s2').value=btc.sell?btc.sell[1]:95000;$('btc_s3').value=btc.sell?btc.sell[2]:110000;
  $('ghToken').value=localStorage.getItem('ght')||'';
  initProj();
  calc();rH();
  autoSize();
}

function calc(){
  const s=getS();
  const total=KS.reduce((a,k)=>a+s[k],0);
  const eq=s.eq,bo=s.bo,mm=s.mm,cash=s.c1+s.c2+s.c3,sat=s.sa;
  const invested=eq+bo,liquid=mm+cash;

  $('tot').textContent=total>0?'€'+fm(total):'-';
  $('totD').textContent=total>0?'Invested \u20AC'+fm(invested)+' \u00B7 Liquid \u20AC'+fm(liquid)+(sat>0?' \u00B7 Satellite \u20AC'+fm(sat):''):'';

  // Derived targets (€)
  const tInv=T.inv/100*total, tLiq=T.liq/100*total, tSat=T.sat/100*total;
  const tEq=T.r_eq/100*tInv, tBo=T.r_bo/100*tInv;
  const tMm=T.r_mm/100*tLiq, tCa=T.r_ca/100*tLiq;

  // Allocation display
  const pInv=total>0?(invested/total*100).toFixed(0):0;
  const pLiq=total>0?(liquid/total*100).toFixed(0):0;
  const pSat=total>0?(sat/total*100).toFixed(0):0;
  const gInv=tInv-invested,gLiq=tLiq-liquid,gSat=tSat-sat;
  const subEq=invested>0?(eq/invested*100).toFixed(0):0;
  const subBo=invested>0?(bo/invested*100).toFixed(0):0;
  const subMm=liquid>0?(mm/liquid*100).toFixed(0):0;
  const subCa=liquid>0?(cash/liquid*100).toFixed(0):0;

  function gapH(g){return Math.abs(g)<50?'<span class="mu">\u2014</span>':(g>0?`<span class="neg">${fmC(-Math.abs(g))}</span>`:`<span class="pos">+${fmC(-g)}</span>`)}

  let a='';
  a+=`<div class="arow"><span class="l">Invested</span><span class="r">${fmC(invested)} <span class="mu">${pInv}% \u2192 ${T.inv}%</span> <span class="gap">${gapH(gInv)}</span></span></div>`;
  a+=`<div class="arow sub"><span class="l">Equity</span><span class="r">${fmC(eq)} <span class="mu">${subEq}% / ${T.r_eq}%</span></span></div>`;
  a+=`<div class="arow sub"><span class="l">Bond</span><span class="r">${fmC(bo)} <span class="mu">${subBo}% / ${T.r_bo}%</span></span></div>`;
  a+=`<div class="arow"><span class="l">Liquid</span><span class="r">${fmC(liquid)} <span class="mu">${pLiq}% \u2192 ${T.liq}%</span> <span class="gap">${gapH(gLiq)}</span></span></div>`;
  a+=`<div class="arow sub"><span class="l">Money Market</span><span class="r">${fmC(mm)} <span class="mu">${subMm}% / ${T.r_mm}%</span></span></div>`;
  a+=`<div class="arow sub"><span class="l">Cash</span><span class="r">${fmC(cash)} <span class="mu">${subCa}% / ${T.r_ca}%</span></span></div>`;
  a+=`<div class="arow"><span class="l">Satellite</span><span class="r">${fmC(sat)} <span class="mu">${pSat}% \u2192 ${T.sat}%</span> <span class="gap">${gapH(gSat)}</span></span></div>`;
  $('alloc').innerHTML=a;

  // Actions — numbered steps with explanations
  let acts='<div class="ah">Actions</div>';
  let step=0;

  const surplus=liquid-tLiq;
  const idealEqR=T.r_eq/(T.r_eq+T.r_bo)*100;
  const actualEqR=invested>0?eq/invested*100:0;
  const eqBoDrift=invested>0?Math.abs(actualEqR-idealEqR):0;

  // Step: Sell invested to rebuild liquidity (if invested over AND liquid under)
  if(invested>tInv+500&&surplus<-500){
    step++;
    const sellAmt=Math.round(Math.min(invested-tInv,Math.abs(surplus)));
    const taxCostLiq=Math.round(sellAmt*(cfg.gEq/100/(1+cfg.gEq/100))*0.20);
    acts+=`<div class="act"><span><b>${step}.</b> Rebuild liquidity (invested ${pInv}%, liquid ${pLiq}%)</span><span class="av neg">€${fmA(sellAmt)} needed</span></div>`;
    acts+=`<div class="act-note">Option A (free): stop investing, let salary rebuild liquid over time.</div>`;
    acts+=`<div class="act-note">Option B (now): sell €${fmA(sellAmt)} from investments. Tax cost approx €${fmA(taxCostLiq)}.</div>`;
  }

  // Step: Rebalance Equity/Bond ratio
  if(eqBoDrift>5){
    step++;
    const from=actualEqR>idealEqR?'Equity':'Bond';
    const to=actualEqR>idealEqR?'Bond':'Equity';
    const sellAmt=Math.round(Math.abs(eq-(idealEqR/100)*invested));
    const gPct=actualEqR>idealEqR?cfg.gEq:cfg.gBo;
    const taxCost=Math.round(sellAmt*(gPct/100/(1+gPct/100))*0.20);
    const tranchesToFix=cfg.cap>0?Math.ceil(sellAmt/cfg.cap):99;
    acts+=`<div class="act"><span><b>${step}.</b> Rebalance invested (${Math.round(actualEqR)}/${Math.round(100-actualEqR)} vs ${T.r_eq}/${T.r_bo})</span><span class="av" style="color:#a78bfa">€${fmA(sellAmt)} off</span></div>`;
    acts+=`<div class="act-note">Option A (free): invest next ${tranchesToFix} tranches 100% into ${to}. No tax, takes time.</div>`;
    acts+=`<div class="act-note">Option B (now): sell €${fmA(sellAmt)} ${from}, buy ${to}. Tax cost approx €${fmA(taxCost)}.</div>`;
  }

  // Step: Move Cash → Money Market (if surplus exists and MM below target)
  if(surplus>300){
    const mmNeed=Math.max(0,tMm-mm);
    if(mmNeed>50){
      step++;
      acts+=`<div class="act"><span><b>${step}.</b> Move cash → Money Market</span><span class="av" style="color:#f59e0b">€${fmA(Math.round(mmNeed))}</span></div>`;
      acts+=`<div class="act-note">Money Market is ${subMm}% of your liquid (target ${T.r_mm}%). Fill it before investing.</div>`;
    }

    // Step: Invest surplus (capped)
    const investable=Math.max(0,surplus-mmNeed);
    if(investable>=300){
      step++;
      const capMult=cfg.gEq<0?1.5:1;
      const dynCap=Math.round(cfg.cap*capMult);
      const amt=Math.min(investable,dynCap);
      const eqG=Math.max(0,tEq-eq),boG=Math.max(0,tBo-bo);
      const invGap=eqG+boG;
      let toEq,toBo;
      if(invGap>0){toEq=Math.round(amt*eqG/invGap);toBo=amt-toEq}
      else{toEq=Math.round(amt*T.r_eq/100);toBo=amt-toEq}
      acts+=`<div class="act"><span><b>${step}.</b> Invest: €${fmA(toEq)} Equity + €${fmA(toBo)} Bond</span><span class="av" style="color:#3b82f6">€${fmA(amt)}</span></div>`;
      const capNote=capMult>1?`Market is down (${cfg.gEq}%). Cap increased to €${fmA(dynCap)} (x1.5). `:'';
      acts+=`<div class="act-note">${capNote}You have €${fmA(Math.round(surplus))} excess liquidity.${investable>dynCap?' Remaining €'+fmA(Math.round(investable-dynCap))+' for next time.':''}</div>`;
    }
  }else if(surplus<-500&&invested<=tInv){
    // Liquid below target, invested also below — accumulate
    step++;
    acts+=`<div class="act"><span><b>${step}.</b> Accumulate</span><span class="av mu">—</span></div>`;
    acts+=`<div class="act-note">Liquidity is below target (${pLiq}% vs ${T.liq}%). Wait for income before investing.</div>`;
  }

  // Priority 3: MM/Cash rebalance (only when liquid is AT target, not when surplus exists)
  if(surplus>-500&&surplus<=300&&liquid>0){
    const mmIdeal=T.r_mm/100*tLiq;
    const mmOff=mm-mmIdeal;
    if(mmOff>200){
      step++;
      acts+=`<div class="act"><span><b>${step}.</b> Money Market → Cash</span><span class="av mu">€${fmA(Math.round(mmOff))}</span></div>`;
      acts+=`<div class="act-note">Money Market is over its ${T.r_mm}% share of liquid. Move excess to cash accounts.</div>`;
    }else if(mmOff<-200&&cash>tCa){
      step++;
      acts+=`<div class="act"><span><b>${step}.</b> Cash → Money Market</span><span class="av" style="color:#f59e0b">€${fmA(Math.round(-mmOff))}</span></div>`;
      acts+=`<div class="act-note">Money Market is below its ${T.r_mm}% share. Move cash to earn yield.</div>`;
    }
  }

  // Step: Satellite
  const saGap=Math.max(0,tSat-sat);
  const nBuyTranches=btc.buy.length;
  if(saGap>100){
    step++;
    const perTranche=Math.round(saGap/nBuyTranches);
    let trancheNote=btc.buy.map((p,i)=>`T${i+1}: €${fmA(p)} (€${fmA(perTranche)})`).join(' | ');
    acts+=`<div class="act"><span><b>${step}.</b> Buy Satellite (BTC)</span><span class="av" style="color:#ef4444">€${fmA(perTranche)}/tranche</span></div>`;
    acts+=`<div class="act-note">${trancheNote}</div>`;
    acts+=`<div class="act-note">Total budget: €${fmA(Math.round(saGap))}. Buy each tranche when price reaches target.</div>`;
  }else if(sat>tSat+100){
    step++;
    const nSellTranches=btc.sell.length;
    const pctEach=Math.floor(100/nSellTranches);
    let sellNote=btc.sell.map((p,i)=>{
      const pct=i<nSellTranches-1?pctEach:(100-(pctEach*(nSellTranches-1)));
      return `T${i+1}: sell ${pct}% at €${fmA(p)}`;
    }).join(' | ');
    acts+=`<div class="act"><span><b>${step}.</b> Satellite — take profit</span><span class="pos">+€${fmA(Math.round(sat-tSat))} over target</span></div>`;
    acts+=`<div class="act-note">${sellNote}</div>`;
  }

  if(step===0)acts+=`<div class="act"><span class="mu">All on target. Nothing to do.</span><span></span></div>`;
  $('acts').innerHTML=acts;

  localStorage.setItem('fs',JSON.stringify(s));
  renderVisuals();
  autoSize();
}

function renderDonut(s,total){

    {label:'Bond',val:bo,color:'#10b981'},
    {label:'Money Market',val:mm,color:'#f59e0b'},
    {label:'Cash',val:cash,color:'#6b7280'},
    {label:'Satellite',val:sat,color:'#ef4444'},
  ].filter(s=>s.val>0);
  let grad='',cum=0;
  segs.forEach(s=>{const pct=s.val/total*100;grad+=`${s.color} ${cum}% ${cum+pct}%,`;cum+=pct});
  grad=grad.slice(0,-1);
  const satPct=sat/total*100;

  if(eq>0)legend+=`<div style="padding-left:10px"><span style="background:#3b82f6"></span>Equity ${fmP(eq/total*100)}</div>`;
  if(bo>0)legend+=`<div style="padding-left:10px"><span style="background:#10b981"></span>Bond ${fmP(bo/total*100)}</div>`;
  legend+=`<div style="margin-top:4px;margin-bottom:3px"><b>Liquid ${fmP(liquid/total*100)}</b></div>`;
  if(mm>0)legend+=`<div style="padding-left:10px"><span style="background:#f59e0b"></span>Money Market ${fmP(mm/total*100)}</div>`;
  if(cash>0)legend+=`<div style="padding-left:10px"><span style="background:#6b7280"></span>Cash ${fmP(cash/total*100)}</div>`;
  if(sat>0)legend+=`<div style="margin-top:4px"><b>Satellite ${fmP(satPct)}</b></div><div style="padding-left:10px"><span style="background:#ef4444"></span>BTC ${fmP(satPct)}</div>`;

// === RISK PROFILE ===
function renderRisk(s,total){
  if(total<=0){$('risk').innerHTML='';return}
  const eq=s.eq/total,bo=s.bo/total,mm=s.mm/total,cash=(s.c1+s.c2+s.c3)/total,sat=s.sa/total;
  const srri=Math.round((eq*4+bo*3+mm*1+cash*1+sat*7)*10)/10;
  const vol=Math.sqrt(Math.pow(eq*9.64,2)+Math.pow(bo*4.16,2)+Math.pow(mm*0.15,2)+Math.pow(sat*60,2));
  const srriFill=((srri-1)/6)*100;
  const riskPct=((eq+bo+sat)*100).toFixed(0);
  const safePct=((mm+cash)*100).toFixed(0);
  // Historical best/worst per asset (from justETF real data)
  const bestY=eq*24.83+bo*6.73+mm*3.99+cash*0+sat*150; // best years: ACWI 2024, Bond 2023, MM 2024, BTC cycle
  const worstY=eq*(-13.24)+bo*(-18.11)+mm*0+cash*0+sat*(-50); // worst: ACWI 2022, Bond 2022, BTC bear
  const bestEur=Math.round(total*bestY/100);
  const worstEur=Math.round(total*Math.abs(worstY)/100);
  $('risk').innerHTML=`
    <div style="font-size:.7em;opacity:.4;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Risk Profile</div>
    <div style="font-size:1.4em;font-weight:700;color:#f8fafc">${srri.toFixed(1)}<span style="font-size:.5em;opacity:.4"> / 7</span></div>
    <div class="risk-bar"><div class="risk-fill" style="width:100%"></div><div class="risk-dot" style="left:${srriFill}%"></div></div>
    <div class="risk-labels"><span>Conservative</span><span>Aggressive</span></div>
    <div class="risk-val">
      Volatility: ${vol.toFixed(1)}%/yr<br>
      Best year: +${bestY.toFixed(0)}% (+\u20AC${fm(bestEur)})<br>
      Worst year: ${worstY.toFixed(0)}% (-\u20AC${fm(worstEur)})<br>
      Risk exposure: ${riskPct}% · Safe: ${safePct}%
    </div>`;
}

let projYears=10,projSc=1,projFull=false,projReal=false;
const SCENARIOS=[{name:'Pessimistic',eqR:4,boR:1,mmR:1.5,color:'#ef4444'},{name:'Base',eqR:8,boR:2.5,mmR:2,color:'#3b82f6'},{name:'Optimistic',eqR:12,boR:3.5,mmR:3,color:'#10b981'}];
const INFLATION=2;

function updProjUI(){

function togReal(){projReal=!projReal;$('togRealBtn').textContent=projReal?'Real (-2% infl.)':'Nominal';renderProj()}
function renderProj(){
  const s=getS();
  const invested=s.eq+s.bo;
  if(invested<=0&&!projFull){$('projInfo').innerHTML='';return}
  const mc=cfg.mc||400;
  const sc=SCENARIOS[projSc];
  const infl=projReal?INFLATION:0;
  // Rates per asset (adjusted for inflation if toggled)
  const rEq=(sc.eqR-infl)/100/12;
  const rBo=(sc.boR-infl)/100/12;
  const rMm=(sc.mmR-infl)/100/12;
  const months=projYears*12;
  // Starting values
  let vEq=s.eq,vBo=s.bo,vMm=projFull?s.mm:0,vCash=projFull?(s.c1+s.c2+s.c3):0,vBtc=projFull?s.sa:0;
  const startEq=vEq,startBo=vBo,startMm=vMm;
  const startVal=vEq+vBo+vMm+vCash+vBtc;
  let totalContrib=startVal;
  const eqRatio=T.r_eq/100,boRatio=T.r_bo/100;
  let contribs=[startVal],returns=[0],compound=[0];
  let cumRet=0,totalVal=startVal;
  let growthEq=0,growthBo=0,growthMm=0;
  for(let m=1;m<=months;m++){
    const gEq=vEq*rEq,gBo=vBo*rBo,gMm=vMm*rMm;
    growthEq+=gEq;growthBo+=gBo;growthMm+=gMm;
    const totalGrowth=gEq+gBo+gMm;
    const retOnContrib=totalContrib>0?totalGrowth*(totalContrib/totalVal):0;
    cumRet+=retOnContrib;
    vEq+=gEq+mc*eqRatio;
    vBo+=gBo+mc*boRatio;
    vMm+=gMm;
    totalContrib+=mc;
    totalVal=vEq+vBo+vMm+vCash+vBtc;
    contribs.push(totalContrib);
    returns.push(cumRet);
    compound.push(Math.max(0,totalVal-totalContrib-cumRet));
  }
  // Draw
  const c=$('projChart'),ctx=c.getContext('2d'),dpr=window.devicePixelRatio||1;
  const W=c.offsetWidth||700,H=200;
  c.width=W*dpr;c.height=H*dpr;c.style.height=H+'px';ctx.scale(dpr,dpr);ctx.clearRect(0,0,W,H);
  const pad={t:10,b:22,l:48,r:10};
  const mx=totalVal*1.08;
  function yP(v){return pad.t+(1-v/mx)*(H-pad.t-pad.b)}
  function xP(m){return pad.l+m*(W-pad.l-pad.r)/months}
  // Grid
  ctx.strokeStyle='#1e293b';ctx.lineWidth=0.5;
  for(let i=0;i<5;i++){const y=pad.t+(H-pad.t-pad.b)*i/4;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();ctx.fillStyle='rgba(255,255,255,.15)';ctx.font='8px Inter';ctx.textAlign='right';ctx.fillText('\u20AC'+fm(Math.round(mx-mx*i/4)),pad.l-4,y+3)}
  // Areas
  function area(bot,top,col){ctx.beginPath();for(let m=0;m<=months;m++)ctx.lineTo(xP(m),yP(top(m)));for(let m=months;m>=0;m--)ctx.lineTo(xP(m),yP(bot(m)));ctx.closePath();ctx.fillStyle=col;ctx.fill()}
  area(m=>0,m=>contribs[m],'#334155');
  area(m=>contribs[m],m=>contribs[m]+returns[m],sc.color+'50');
  area(m=>contribs[m]+returns[m],m=>contribs[m]+returns[m]+compound[m],sc.color+'22');
  // Top line
  ctx.strokeStyle=sc.color;ctx.lineWidth=2;ctx.beginPath();
  for(let m=0;m<=months;m++){const v=contribs[m]+returns[m]+compound[m];m?ctx.lineTo(xP(m),yP(v)):ctx.moveTo(xP(m),yP(v))}ctx.stroke();
  // X labels
  ctx.fillStyle='rgba(255,255,255,.2)';ctx.font='8px Inter';ctx.textAlign='center';
  for(let y=0;y<=projYears;y+=Math.max(1,Math.floor(projYears/5)))ctx.fillText(y+'Y',xP(y*12),H-5);
  // Info
  const fC=contribs[months],fR=returns[months],fCo=compound[months],fT=fC+fR+fCo;
  const growthPct=fC>0?((fT-fC)/fC*100).toFixed(0):0;
  const retPct=fC>0?(fR/fC*100).toFixed(0):0;
  const compPct=fC>0?(fCo/fC*100).toFixed(0):0;
  $('projInfo').innerHTML=`
    <div class="proj-card"><div class="pl">Contributed</div><div class="pv" style="color:#94a3b8">\u20AC${fm(Math.round(fC))}</div></div>
    <div class="proj-card"><div class="pl">Returns</div><div class="pv" style="color:${sc.color}">\u20AC${fm(Math.round(fR))}</div><div class="pl">+${retPct}% on contributions</div></div>
    <div class="proj-card"><div class="pl">Compound</div><div class="pv" style="color:${sc.color}">\u20AC${fm(Math.round(fCo))}</div><div class="pl">+${compPct}% snowball</div></div>
    <div style="grid-column:1/-1;text-align:center;margin-top:6px;font-size:.9em;color:#f8fafc;font-weight:700">\u20AC${fm(Math.round(fT))} <span style="opacity:.4;font-weight:400">in ${projYears}Y</span> <span style="color:${sc.color}">+${growthPct}%</span></div>
    <div style="grid-column:1/-1;font-size:.68em;opacity:.4;margin-top:8px">Growth breakdown: Equity +\u20AC${fm(Math.round(growthEq))}${growthBo>0?' \u00B7 Bond +\u20AC'+fm(Math.round(growthBo)):''}${growthMm>0?' \u00B7 MM +\u20AC'+fm(Math.round(growthMm)):''}</div>
    <div style="grid-column:1/-1;font-size:.62em;opacity:.25">${projFull?'Full portfolio':'Investments only'} \u00B7 ${projReal?'Real (inflation adjusted)':'Nominal'} \u00B7 ${sc.name} ${((sc.eqR*eqRatio+sc.boR*boRatio)-infl).toFixed(1)}%/yr \u00B7 \u20AC${fm(mc)}/month</div>`;
  // Store for hover
  window._proj={contribs,returns:returns,compound,months,pad,W,H,mx,sc};
}

function calcW(){
  const need=parseFloat($('w_amt').value)||0;
  if(need<=0){$('wResult').innerHTML='';return}
  const s=getS();
  const eq=s.eq,bo=s.bo,mm=s.mm,cash=s.c1+s.c2+s.c3,sat=s.sa;
  const total=KS.reduce((a,k)=>a+s[k],0);
  const tLiq=T.liq/100*total;

  // Priority: 1. Cash (free), 2. Money Market (free, 1-2 days), 3. Sell Bond (low vol, tax), 4. Sell Equity (high vol, tax), 5. Sell Satellite (speculative, tax)
  let remaining=need;
  let steps=[];

  // 1. Cash above floor
  const cashFloor=T.r_ca/100*(T.liq/100*total);
  const cashAvail=Math.max(0,cash-cashFloor);
  if(remaining>0&&cashAvail>0){
    const take=Math.min(remaining,cashAvail);
    steps.push({src:'Cash (accounts)',amt:take,note:'Instant, no cost, no tax',color:'#6b7280'});
    remaining-=take;
  }

  // 2. Cash below floor (touch emergency)
  if(remaining>0&&cash-cashAvail>0){
    const take=Math.min(remaining,cash-cashAvail);
    steps.push({src:'Cash (emergency reserve)',amt:take,note:'Touches your floor. Rebuild after.',color:'#f59e0b'});
    remaining-=take;
  }

  // 3. Money Market
  if(remaining>0&&mm>0){
    const take=Math.min(remaining,mm);
    steps.push({src:'Money Market (CSH2)',amt:take,note:'Sell order, available in 1-2 days. No tax (money market).',color:'#f59e0b'});
    remaining-=take;
  }

  // 4. Bond
  if(remaining>0&&bo>0){
    const take=Math.min(remaining,bo);
    const tax=Math.round(take*(cfg.gBo/100/(1+cfg.gBo/100))*0.19);
    steps.push({src:'Bond (Gov EUR)',amt:take,note:`Sell order, 1-2 days. Tax on gain: approx €${fmA(tax)}.`,color:'#10b981'});
    remaining-=take;
  }

  // 5. Equity
  if(remaining>0&&eq>0){
    const take=Math.min(remaining,eq);
    const tax=Math.round(take*(cfg.gEq/100/(1+cfg.gEq/100))*0.20);
    steps.push({src:'Equity (ACWI)',amt:take,note:`Sell order, 1-2 days. Tax on gain: approx €${fmA(tax)}. Avoid if possible.`,color:'#3b82f6'});
    remaining-=take;
  }

  // 6. Satellite
  if(remaining>0&&sat>0){
    const take=Math.min(remaining,sat);
    const tax=Math.round(take*(cfg.gSa/100/(1+cfg.gSa/100))*0.21);
    steps.push({src:'Satellite (BTC)',amt:take,note:`Sell on exchange, 1-3 days. Tax on gain: approx €${fmA(tax)}.`,color:'#ef4444'});
    remaining-=take;
  }

  let h='';
  steps.forEach((s,i)=>{
    h+=`<div class="act"><span><b>${i+1}.</b> ${s.src}</span><span class="av" style="color:${s.color}">€${fmA(Math.round(s.amt))}</span></div>`;
    h+=`<div class="act-note">${s.note}</div>`;
  });
  if(remaining>0)h+=`<div class="act"><span class="neg">Not enough assets. Short €${fmA(Math.round(remaining))}.</span><span></span></div>`;
  $('wResult').innerHTML=h;
}

function saveAll(){
  const s=getS();const total=KS.reduce((a,k)=>a+s[k],0);if(total<=0)return;
  // Skip if all values identical to most recent snapshot (any date)
  if(hist.length>0){const last=hist[hist.length-1];if(last.s){const same=KS.every(k=>Math.round(s[k])===Math.round(last.s[k]||0));if(same){$('ss').textContent='No changes';return}}}
  hist=hist.filter(x=>x.d!==new Date().toISOString().slice(0,10));
  hist.push({d:new Date().toISOString().slice(0,10),t:total,s:{...s}});
  hist.sort((a,b)=>a.d.localeCompare(b.d));
  localStorage.setItem('fh',JSON.stringify(hist));rH();
  // Auto-sync to cloud
  const t=localStorage.getItem('ght');
  if(t){fetch('https://api.github.com/gists/'+GID,{method:'PATCH',headers:{'Authorization':'token '+t,'Content-Type':'application/json'},body:JSON.stringify({files:{[GF]:{content:JSON.stringify({s:getS(),T,cfg,btc,h:hist})}}})}).then(r=>{$('ss').textContent=r.ok?'Saved & synced':'Saved locally (sync failed)'}).catch(()=>{$('ss').textContent='Saved locally'})}
  else{$('ss').textContent='Saved locally (set token in Settings to sync)'}
}
function rH(){
  const clean=hist.filter((e,i)=>i===0||Math.round(e.t)!==Math.round(hist[i-1].t));
  const rev=[...clean].reverse().slice(0,10);
  let h='';rev.forEach((e,i)=>{
    const prev=rev[i+1];
    const delta=prev?(e.t-prev.t):0;
    const ds=delta?` <span style="color:${delta>=0?'#10b981':'#ef4444'};font-size:.9em">${delta>=0?'+':''}${fm(delta)}</span>`:'';
    h+=`<div><span>${e.d}</span><span>\u20AC${fm(e.t)}${ds} <span style="opacity:.2;cursor:pointer;margin-left:4px" onclick="delSnap('${e.d}')">x</span></span></div>`;
  });
  $('hl').innerHTML=h||'<div style="opacity:.15;text-align:center">No data</div>';
  renderInsights();
}
function delSnap(d){if(!confirm('Delete snapshot '+d+'?'))return;hist=hist.filter(x=>x.d!==d);localStorage.setItem('fh',JSON.stringify(hist));rH()}
function renderInsights(){
  if(hist.length<2){$('insights').innerHTML='';return}
  const first=hist[0],last=hist[hist.length-1];
  const days=(new Date(last.d)-new Date(first.d))/86400000;
  if(days<1){$('insights').innerHTML='';return}
  const months=days/30.44;
  const years=days/365.25;

  const totalReturn=(last.t-first.t)/first.t;
  const annReturn=years>0.01?Math.pow(1+totalReturn,1/years)-1:totalReturn;
  const avgMonthlyChange=months>0?(last.t-first.t)/months:0;

  const mc=cfg.mc||400;
  const baseRate=0.069/12;
  let projected=first.t;
  for(let m=0;m<Math.round(months);m++){projected=projected*(1+baseRate)+mc}
  const vsProj=last.t-projected;

  const milestones=[50000,75000,100000,150000,200000,300000,500000,750000,1000000];
  const nextM=milestones.find(m=>m>last.t);
  const toNext=nextM?nextM-last.t:0;
  const monthsToNext=avgMonthlyChange>0&&toNext>0?Math.round(toNext/avgMonthlyChange):0;

  let h='<div style="font-size:.68em;opacity:.5;margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em">Insights</div>';
  h+=`<div style="font-size:.72em;margin-bottom:4px">Return: <b>${(annReturn*100).toFixed(1)}%</b> annualized (${Math.round(days)} days)</div>`;
  h+=`<div style="font-size:.72em;margin-bottom:4px">Pace: <b>\u20AC${fm(Math.round(avgMonthlyChange))}/month</b></div>`;
  const projColor=vsProj>=0?'#10b981':'#ef4444';
  h+=`<div style="font-size:.72em;margin-bottom:4px">vs Projection: <span style="color:${projColor}">${vsProj>=0?'+':''}\u20AC${fm(Math.round(vsProj))}</span></div>`;
  if(nextM&&monthsToNext>0){
    h+=`<div style="font-size:.72em">Milestone: <b>\u20AC${fm(nextM)}</b> — \u20AC${fm(Math.round(toNext))} to go${monthsToNext<999?' ('+monthsToNext+' months)':''}</div>`;
  }
  $('insights').innerHTML=h;
}
async function loadFromCloud(){
  const t=localStorage.getItem('ght');if(!t)return;
  try{const r=await fetch('https://api.github.com/gists/'+GID,{headers:{'Authorization':'token '+t}});if(!r.ok)return;
  const g=await r.json();if(!g.files[GF])return;const d=JSON.parse(g.files[GF].content);
  if(d.s)KS.forEach(k=>{const el=$('s_'+k);el.dataset.raw=d.s[k]||'';el.value=d.s[k]?String(d.s[k]):'';fmInput(el)});
  if(d.T){T=d.T;$('t_inv').value=T.inv;$('t_liq').value=T.liq;$('t_sat').value=T.sat;$('r_eq').value=T.r_eq;$('r_bo').value=T.r_bo;$('r_mm').value=T.r_mm;$('r_ca').value=T.r_ca}
  if(d.cfg){cfg=d.cfg;$('cfg_cap').value=cfg.cap;$('cfg_mc').value=cfg.mc||400;$('cfg_gEq').value=cfg.gEq||0;$('cfg_gBo').value=cfg.gBo||0;$('cfg_gSa').value=cfg.gSa||0}
  if(d.btc){btc=d.btc;if(!btc.buy)btc={buy:[50000,45000,38000],sell:[80000,95000,110000]};$('btc_b1').value=btc.buy[0];$('btc_b2').value=btc.buy[1];$('btc_b3').value=btc.buy[2];$('btc_s1').value=btc.sell[0];$('btc_s2').value=btc.sell[1];$('btc_s3').value=btc.sell[2]}
  if(d.h){hist=d.h;localStorage.setItem('fh',JSON.stringify(hist))}
  localStorage.setItem('ft',JSON.stringify(T));localStorage.setItem('fc',JSON.stringify(cfg));localStorage.setItem('fb',JSON.stringify(btc));
  calc();rH()}catch(e){}}

if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>{init();loadFromCloud()});else{init();loadFromCloud()}
window.addEventListener('resize',()=>{renderProj()});
</script>
