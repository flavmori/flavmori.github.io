<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolio Rebalancer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#0a0a0f,#1a1a2e,#16213e);min-height:100vh;padding:24px;color:#e2e8f0;font-size:14px}
#lock{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;gap:16px}
#lock input{font-family:'Inter',sans-serif;padding:12px 20px;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:#fff;font-size:1em;text-align:center;width:220px}
#lock button{font-family:'Inter',sans-serif;padding:10px 24px;border-radius:8px;border:none;background:#3b82f6;color:#fff;font-size:.9em;cursor:pointer;font-weight:500}
#lock .err{color:#ef4444;font-size:.8em}
#app{display:none}
.container{max-width:840px;margin:0 auto}
h1{text-align:center;font-size:1.5em;margin-bottom:4px;font-weight:700;color:#f8fafc}
.sub-h{text-align:center;opacity:.35;margin-bottom:28px;font-size:.75em;text-transform:uppercase;letter-spacing:.06em}
.card{background:rgba(255,255,255,.025);border-radius:10px;padding:18px;border:1px solid rgba(255,255,255,.06);margin-bottom:14px}
.card-t{font-size:.7em;font-weight:600;margin-bottom:12px;text-transform:uppercase;letter-spacing:.06em;opacity:.35}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:600px){.g2,.g3{grid-template-columns:1fr 1fr}}
.f{display:flex;flex-direction:column;gap:3px}
.f label{font-size:.68em;opacity:.4;font-weight:500;text-transform:uppercase;letter-spacing:.03em}
.f input{font-family:'Inter',sans-serif;padding:8px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:#f1f5f9;font-size:.9em;width:100%}
.f input:focus{outline:none;border-color:#3b82f6}
.total{text-align:center;padding:18px;background:rgba(255,255,255,.04);border-radius:10px;margin-bottom:14px;border:1px solid rgba(255,255,255,.07)}
.total .n{font-size:2em;font-weight:700;color:#f8fafc}
.total .d{opacity:.35;font-size:.75em;margin-top:6px}
.bk{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:7px;margin-bottom:4px;background:rgba(255,255,255,.015);border:1px solid rgba(255,255,255,.04)}
.bk .l{width:140px;font-size:.75em;font-weight:500;line-height:1.3}
.bk .l small{display:block;font-weight:400;opacity:.3;font-size:.88em}
.bk .bw{flex:1;height:16px;background:rgba(255,255,255,.04);border-radius:3px;position:relative;overflow:hidden}
.bk .bf{height:100%;border-radius:3px;position:absolute;top:0;left:0}
.bk .bm{position:absolute;top:0;height:100%;width:1.5px;background:rgba(255,255,255,.35)}
.bk .bp{position:absolute;top:50%;right:5px;transform:translateY(-50%);font-size:.6em;font-weight:600;opacity:.6}
.bk .v{width:120px;text-align:right;font-size:.7em;line-height:1.4;font-variant-numeric:tabular-nums}
.pos{color:#10b981}.neg{color:#ef4444}.mu{opacity:.3}
.rb{padding:9px 12px;border-radius:7px;margin-bottom:4px;border:1px solid rgba(139,92,246,.12);background:rgba(139,92,246,.025);font-size:.75em;color:#a78bfa}
.sbox{padding:16px;border-radius:10px;margin-bottom:14px;border:1px solid rgba(59,130,246,.12);background:rgba(59,130,246,.03)}
.sbox .st{font-size:.72em;font-weight:600;margin-bottom:10px;color:#93c5fd;text-transform:uppercase;letter-spacing:.05em}
.sbox .avail{font-size:.85em;margin-bottom:12px;padding:8px 12px;background:rgba(255,255,255,.03);border-radius:6px;border:1px solid rgba(255,255,255,.05)}
.sbox .avail strong{color:#f8fafc}
.sr{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.03);font-size:.82em}
.sr:last-child{border:none}
.sr .sv{font-weight:600;font-variant-numeric:tabular-nums}
.sr .sn{font-size:.78em;opacity:.35}
.ss{margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.05)}
.ss .sl{font-size:.68em;opacity:.35;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
.cfg{display:flex;gap:10px;align-items:end}
.cfg .f{flex:1}
.sett{display:none;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.05)}
.btn{font-family:'Inter',sans-serif;padding:7px 14px;border-radius:6px;border:none;color:#fff;font-size:.75em;cursor:pointer;font-weight:500}
.btn:active{transform:scale(.97)}
.bp-btn{background:#3b82f6}
.bs-btn{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hc{width:100%;height:120px;position:relative;margin-top:8px}
.hl{max-height:100px;overflow-y:auto;font-size:.68em;margin-top:8px}
.hl .he{display:flex;justify-content:space-between;padding:3px 5px;border-bottom:1px solid rgba(255,255,255,.025)}
.sync{font-size:.6em;opacity:.3;text-align:center;margin-top:5px}
.nav{position:fixed;top:12px;left:12px;font-size:.72em;opacity:.25;text-decoration:none;color:#fff}
.nav:hover{opacity:.6}
</style>
</head>
<body>
<a href="index.html" class="nav">back</a>
<div id="lock">
<input type="password" id="pw" placeholder="Password" onkeydown="if(event.key==='Enter')unlock()">
<button onclick="unlock()">Enter</button>
<div class="err" id="err"></div>
</div>
<div id="app"><div class="container">
<h1>Portfolio Rebalancer</h1>
<p class="sub-h">Allocation · Rebalancing · Tracking</p>

<div class="total"><div class="n" id="tot">-</div><div class="d" id="totD"></div></div>

<div class="card">
<div class="card-t">Balances</div>
<div class="g3">
<div class="f"><label>Equity (ACWI)</label><input type="number" id="s_eq" step=".01" oninput="calc()"></div>
<div class="f"><label>Bond (Gov EUR)</label><input type="number" id="s_bo" step=".01" oninput="calc()"></div>
<div class="f"><label>Money Market (CSH2)</label><input type="number" id="s_mm" step=".01" oninput="calc()"></div>
<div class="f"><label>Cash (Santander)</label><input type="number" id="s_c1" step=".01" oninput="calc()"></div>
<div class="f"><label>Cash (Trade Republic)</label><input type="number" id="s_c2" step=".01" oninput="calc()"></div>
<div class="f"><label>Cash (Other)</label><input type="number" id="s_c3" step=".01" oninput="calc()"></div>
</div>
<div class="g2" style="margin-top:10px">
<div class="f"><label>Satellite (BTC)</label><input type="number" id="s_sa" step=".01" oninput="calc()"></div>
</div>
</div>

<div class="card">
<div class="card-t">Allocation vs Target</div>
<div id="bks"></div>
</div>

<div class="sbox" id="sug"></div>

<div class="card">
<div class="card-t">Configuration</div>
<div class="cfg">
<div class="f"><label>Investment Cap per tranche</label><input type="number" id="cap" value="2500" step="100" oninput="calc()"></div>
</div>
<div class="sett" id="sett">
<div class="card-t" style="margin-top:0">Target Allocation (must sum to 100%)</div>
<div class="g3">
<div class="f"><label>Equity %</label><input type="number" id="t_eq" step="1" oninput="upT()"></div>
<div class="f"><label>Bond %</label><input type="number" id="t_bo" step="1" oninput="upT()"></div>
<div class="f"><label>Money Market %</label><input type="number" id="t_mm" step="1" oninput="upT()"></div>
<div class="f"><label>Cash %</label><input type="number" id="t_ca" step="1" oninput="upT()"></div>
<div class="f"><label>Satellite %</label><input type="number" id="t_sa" step="1" oninput="upT()"></div>
</div>
<div class="mu" id="tMsg" style="font-size:.7em;margin-top:6px"></div>
</div>
<div class="acts">
<button class="btn bp-btn" onclick="save()">Save Snapshot</button>
<button class="btn bs-btn" onclick="toG()">Sync</button>
<button class="btn bs-btn" onclick="frG()">Load</button>
<button class="btn bs-btn" onclick="tog()">Settings</button>
</div>
<div class="sync" id="ss"></div>
</div>

<div class="card">
<div class="card-t">History</div>
<div class="hc"><canvas id="cv"></canvas></div>
<div class="hl" id="hl"></div>
</div>
</div></div>

<script>
const GID='17fedcdc8ee90458b9513999b55a4813',GF='finance.json',PW='flavmori2210';
const KS=['eq','bo','mm','c1','c2','c3','sa'];
let T={eq:64,bo:16,mm:9,ca:6,sa:5};
let hist=[],btc={entry:40000,sell:95000};

function unlock(){if($('pw').value===PW){localStorage.setItem('fa','1');show();init()}else $('err').textContent='Wrong'}
function show(){$('lock').style.display='none';$('app').style.display='block'}
function $(id){return document.getElementById(id)}
function J(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function fm(n){return Math.round(n).toLocaleString('it-IT')}
function getS(){let s={};KS.forEach(k=>s[k]=parseFloat($('s_'+k).value)||0);return s}

function init(){
  const s=J('fs')||{};KS.forEach(k=>{if(s[k])$('s_'+k).value=s[k]});
  T=J('ft')||T;btc=J('fb')||btc;
  const c=J('fc')||{};if(c.cap)$('cap').value=c.cap;
  hist=J('fh')||[];
  $('t_eq').value=T.eq;$('t_bo').value=T.bo;$('t_mm').value=T.mm;$('t_ca').value=T.ca;$('t_sa').value=T.sa;
  calc();rH();
}

function calc(){
  const s=getS();
  const total=KS.reduce((a,k)=>a+s[k],0);
  const eq=s.eq, bo=s.bo, mm=s.mm;
  const cash=s.c1+s.c2+s.c3;
  const sat=s.sa;
  const invested=eq+bo;

  // Total
  $('tot').textContent=total>0?'€'+fm(total):'-';
  if(total>0){
    const r=invested>0?Math.round(eq/invested*100)+'/'+Math.round(bo/invested*100):'—';
    $('totD').innerHTML=`Invested €${fm(invested)} (${r}) · Liquid €${fm(mm+cash)} · Satellite €${fm(sat)}`;
  }

  // Buckets
  const bks=[
    {n:'Equity',s:'ACWI',v:eq,t:T.eq,c:'#3b82f6'},
    {n:'Bond',s:'Gov EUR',v:bo,t:T.bo,c:'#10b981'},
    {n:'Money Market',s:'CSH2',v:mm,t:T.mm,c:'#f59e0b'},
    {n:'Cash',s:'Accounts',v:cash,t:T.ca,c:'#6b7280'},
    {n:'Satellite',s:'BTC',v:sat,t:T.sa,c:'#ef4444'},
  ];
  let h='';
  bks.forEach(b=>{
    const pct=total>0?b.v/total*100:0;
    const te=b.t/100*total;
    const gap=te-b.v;
    const mx=Math.max(pct,b.t,1);
    const bw=Math.min(pct/mx*100,100);
    const mp=b.t/mx*100;
    const gt=Math.abs(gap)<50?'<span class="mu">OK</span>':(gap>0?`<span class="neg">-€${fm(Math.abs(gap))}</span>`:`<span class="pos">+€${fm(-gap)}</span>`);
    h+=`<div class="bk"><div class="l">${b.n}<small>${b.s}</small></div><div class="bw"><div class="bf" style="width:${bw}%;background:${b.c};opacity:.4"></div><div class="bm" style="left:${mp}%"></div><div class="bp">${pct.toFixed(0)}% / ${b.t}%</div></div><div class="v">${gt}<br><span class="mu">€${fm(b.v)} / €${fm(te)}</span></div></div>`;
  });
  // Rebalance (equity/bond ratio drift)
  if(invested>0){
    const idealEqPct=T.eq/(T.eq+T.bo)*100;
    const actualEqPct=eq/invested*100;
    if(Math.abs(actualEqPct-idealEqPct)>5){
      const from=actualEqPct>idealEqPct?'Equity':'Bond';
      const to=actualEqPct>idealEqPct?'Bond':'Equity';
      const amt=Math.round(Math.abs(eq-(idealEqPct/100)*invested));
      h+=`<div class="rb">Rebalance: sell €${fm(amt)} ${from} → buy ${to} (ratio ${Math.round(actualEqPct)}/${Math.round(100-actualEqPct)} vs ${Math.round(idealEqPct)}/${Math.round(100-idealEqPct)})</div>`;
    }
  }
  $('bks').innerHTML=h;

  // Suggestions
  const cap=parseFloat($('cap').value)||2500;
  const cashTarget=T.ca/100*total;
  const mmTarget=T.mm/100*total;
  const eqTarget=T.eq/100*total;
  const boTarget=T.bo/100*total;
  const saTarget=T.sa/100*total;

  const cashExcess=Math.max(0,cash-cashTarget);
  const mmGap=Math.max(0,mmTarget-mm);
  const eqGap=Math.max(0,eqTarget-eq);
  const boGap=Math.max(0,boTarget-bo);
  const saGap=Math.max(0,saTarget-sat);

  let sg='<div class="st">Suggested Actions</div>';
  sg+=`<div class="avail">Available to deploy: <strong>€${fm(cashExcess)}</strong></div>`;
  let any=false;

  // 1. Remunerate
  if(mmGap>0&&cashExcess>0){
    const mv=Math.min(mmGap,cashExcess);
    if(mv>=50){
      sg+=`<div class="sr"><span>Move to Money Market <span class="sn">(remunerate)</span></span><span class="sv" style="color:#f59e0b">€${fm(mv)}</span></div>`;
      any=true;
    }
  }

  // 2. Invest (capped)
  const afterMm=Math.max(0,cashExcess-Math.max(0,mmGap));
  if(afterMm>=300){
    const amt=Math.min(afterMm,cap);
    const invGap=eqGap+boGap;
    let toEq,toBo;
    if(invGap>0){toEq=Math.round(amt*eqGap/invGap);toBo=amt-toEq}
    else{const r=T.eq/(T.eq+T.bo);toEq=Math.round(amt*r);toBo=amt-toEq}
    sg+=`<div class="ss"><div class="sl">Invest (cap €${fm(cap)})</div>`;
    if(toEq>0)sg+=`<div class="sr"><span>Equity <span class="sn">(ACWI)</span></span><span class="sv" style="color:#3b82f6">€${fm(toEq)}</span></div>`;
    if(toBo>0)sg+=`<div class="sr"><span>Bond <span class="sn">(Gov EUR)</span></span><span class="sv" style="color:#10b981">€${fm(toBo)}</span></div>`;
    if(afterMm>cap)sg+=`<div class="sr"><span class="sn">Remaining for next time</span><span class="mu">€${fm(afterMm-amt)}</span></div>`;
    sg+=`</div>`;any=true;
  }else if(eqGap+boGap>0){
    sg+=`<div class="ss"><div class="sl">Invest</div><div class="sr"><span class="mu">Not enough surplus. Accumulate.</span><span></span></div></div>`;
    any=true;
  }

  // 3. Satellite
  if(saGap>0){
    sg+=`<div class="ss"><div class="sl">Satellite (${T.sa}% target)</div>`;
    sg+=`<div class="sr"><span>BTC <span class="sn">buy at ~€${fm(btc.entry)}</span></span><span class="sv" style="color:#ef4444">€${fm(saGap)}</span></div></div>`;
    any=true;
  }else if(sat>saTarget+100){
    sg+=`<div class="ss"><div class="sl">Satellite</div><div class="sr"><span class="mu">Over target — consider profit</span><span class="pos">+€${fm(sat-saTarget)}</span></div></div>`;
    any=true;
  }

  if(!any)sg+=`<div class="sr"><span class="mu">All on target.</span><span></span></div>`;
  $('sug').innerHTML=sg;

  // Save state
  localStorage.setItem('fs',JSON.stringify(s));
  localStorage.setItem('fc',JSON.stringify({cap}));
}

function tog(){const p=$('sett');p.style.display=p.style.display==='none'?'block':'none'}
function upT(){
  T={eq:+$('t_eq').value||0,bo:+$('t_bo').value||0,mm:+$('t_mm').value||0,ca:+$('t_ca').value||0,sa:+$('t_sa').value||0};
  const s=T.eq+T.bo+T.mm+T.ca+T.sa;
  $('tMsg').innerHTML=Math.abs(s-100)>0.5?`<span class="neg">Total: ${s}% (must be 100)</span>`:`Total: ${s}%`;
  localStorage.setItem('ft',JSON.stringify(T));calc();
}

function save(){
  const s=getS();const total=KS.reduce((a,k)=>a+s[k],0);if(total<=0)return;
  const e={d:new Date().toISOString().slice(0,10),t:total,s:{...s}};
  hist=hist.filter(x=>x.d!==e.d);hist.push(e);hist.sort((a,b)=>a.d.localeCompare(b.d));
  localStorage.setItem('fh',JSON.stringify(hist));rH();
  $('ss').textContent='Saved '+new Date().toLocaleTimeString();
}

function rH(){
  let h='';[...hist].reverse().forEach(e=>{h+=`<div class="he"><span>${e.d}</span><span>€${fm(e.t)}</span></div>`});
  $('hl').innerHTML=h||'<div class="mu" style="padding:5px;text-align:center">No data</div>';dC();
}

function dC(){
  const c=$('cv'),x=c.getContext('2d'),d=window.devicePixelRatio||1;
  const W=c.parentElement.getBoundingClientRect().width,H=120;
  c.width=W*d;c.height=H*d;x.scale(d,d);x.clearRect(0,0,W,H);
  if(hist.length<2){x.fillStyle='rgba(255,255,255,.12)';x.font='10px Inter';x.textAlign='center';x.fillText('Min 2 snapshots',W/2,H/2);return}
  const vs=hist.map(h=>h.t),mn=Math.min(...vs)*.95,mx=Math.max(...vs)*1.05;
  const p={t:10,b:16,l:38,r:8};
  x.strokeStyle='rgba(255,255,255,.03)';
  for(let i=0;i<4;i++){const y=p.t+(H-p.t-p.b)*i/3;x.beginPath();x.moveTo(p.l,y);x.lineTo(W-p.r,y);x.stroke();x.fillStyle='rgba(255,255,255,.18)';x.font='7px Inter';x.textAlign='right';x.fillText('€'+fm(mx-(mx-mn)*i/3),p.l-3,y+3)}
  x.strokeStyle='#3b82f6';x.lineWidth=1.5;x.lineJoin='round';x.beginPath();
  hist.forEach((h,i)=>{const px=p.l+i*(W-p.l-p.r)/(hist.length-1);const py=p.t+(1-(h.t-mn)/(mx-mn))*(H-p.t-p.b);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke();
  hist.forEach((h,i)=>{const px=p.l+i*(W-p.l-p.r)/(hist.length-1);const py=p.t+(1-(h.t-mn)/(mx-mn))*(H-p.t-p.b);x.beginPath();x.arc(px,py,2,0,Math.PI*2);x.fillStyle='#93c5fd';x.fill()});
}

function tk(){return localStorage.getItem('ght')||prompt('GitHub Token:')}
async function toG(){
  const t=tk();if(!t)return;localStorage.setItem('ght',t);
  const d={s:getS(),T,btc,cfg:{cap:+$('cap').value},h:hist,u:new Date().toISOString()};
  try{const r=await fetch('https://api.github.com/gists/'+GID,{method:'PATCH',headers:{'Authorization':'token '+t,'Content-Type':'application/json'},body:JSON.stringify({files:{[GF]:{content:JSON.stringify(d)}}})});$('ss').textContent=r.ok?'Synced':'Err '+r.status}catch(e){$('ss').textContent=e.message}
}
async function frG(){
  const t=tk();if(!t)return;localStorage.setItem('ght',t);
  try{const r=await fetch('https://api.github.com/gists/'+GID,{headers:{'Authorization':'token '+t}});if(!r.ok)return;
  const g=await r.json();if(!g.files[GF])return;const d=JSON.parse(g.files[GF].content);
  if(d.s)KS.forEach(k=>{$('s_'+k).value=d.s[k]||0});
  if(d.T){T=d.T;$('t_eq').value=T.eq;$('t_bo').value=T.bo;$('t_mm').value=T.mm;$('t_ca').value=T.ca;$('t_sa').value=T.sa}
  if(d.btc)btc=d.btc;
  if(d.cfg)$('cap').value=d.cfg.cap||2500;
  if(d.h){hist=d.h;localStorage.setItem('fh',JSON.stringify(hist))}
  localStorage.setItem('ft',JSON.stringify(T));localStorage.setItem('fb',JSON.stringify(btc));
  calc();rH();$('ss').textContent='Loaded'}catch(e){$('ss').textContent=e.message}
}

if(localStorage.getItem('fa')==='1'){show();if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init()}else $('pw').focus();
window.addEventListener('resize',dC);
</script>
</body>
</html>
