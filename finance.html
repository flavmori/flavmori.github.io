<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finance Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);min-height:100vh;padding:24px;color:#fff;letter-spacing:-.01em}
#lock{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;gap:16px}
#lock h2{font-size:2em}
#lock input{font-family:'Inter',sans-serif;padding:12px 20px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;font-size:1.1em;text-align:center;width:250px}
#lock button{font-family:'Inter',sans-serif;padding:10px 24px;border-radius:12px;border:none;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:1em;cursor:pointer;font-weight:500}
#lock .err{color:#f87171;font-size:.85em}
#app{display:none}
h1{text-align:center;font-size:2em;margin-bottom:8px;font-weight:700;letter-spacing:-.03em;background:linear-gradient(135deg,#667eea,#764ba2,#f093fb);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{text-align:center;opacity:.7;margin-bottom:24px;font-size:.95em}
.container{max-width:900px;margin:0 auto}
.card{background:rgba(255,255,255,.05);border-radius:16px;padding:20px;border:1px solid rgba(255,255,255,.1);margin-bottom:20px}
.card h2{font-size:1em;font-weight:600;margin-bottom:16px;text-transform:uppercase;letter-spacing:.03em;opacity:.8}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px}
@media(max-width:600px){.grid2,.grid3,.grid4{grid-template-columns:1fr 1fr}}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.78em;opacity:.6;font-weight:500}
.field input,.field select{font-family:'Inter',sans-serif;padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#fff;font-size:1em;width:100%;transition:border-color .2s}
.field input:focus{outline:none;border-color:#764ba2}
.field select{background:#1e1b4b;-webkit-appearance:none;appearance:none}
.field select option{background:#1e1b4b;color:#fff}
.total-bar{text-align:center;padding:20px;background:rgba(255,255,255,.08);border-radius:12px;margin-bottom:20px;border:1px solid rgba(255,255,255,.15)}
.total-bar .big{font-size:2.2em;font-weight:700}
.total-bar .sub{opacity:.6;font-size:.85em;margin-top:8px;line-height:1.6}
.alloc-row{display:flex;align-items:center;gap:12px;padding:14px;border-radius:10px;margin-bottom:8px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06)}
.alloc-row .name{width:140px;font-size:.85em;font-weight:500}
.alloc-row .bar-wrap{flex:1;height:22px;background:rgba(255,255,255,.08);border-radius:6px;position:relative;overflow:hidden}
.alloc-row .bar-fill{height:100%;border-radius:6px;transition:width .3s;position:absolute;top:0;left:0}
.alloc-row .bar-target{position:absolute;top:0;height:100%;width:2px;background:#fff;opacity:.5}
.alloc-row .bar-label{position:absolute;top:50%;transform:translateY(-50%);font-size:.72em;font-weight:600;right:8px}
.alloc-row .info{width:160px;text-align:right;font-size:.8em;font-variant-numeric:tabular-nums;line-height:1.4}
.pos{color:#34d399}.neg{color:#f87171}.warn{color:#fbbf24}.muted{opacity:.5}
.alert-box{padding:12px 16px;border-radius:10px;margin-bottom:16px;font-size:.85em;display:none}
.alert-box.show{display:block}
.alert-warn{background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.25);color:#fbbf24}
.alert-ok{background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.25);color:#34d399}
.invest-result{margin-top:16px;padding:16px;background:rgba(102,126,234,.06);border-radius:12px;border:1px solid rgba(102,126,234,.15)}
.invest-result h3{font-size:.9em;margin-bottom:12px;font-weight:600;opacity:.9}
.invest-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:.9em}
.invest-row:last-child{border:none}
.invest-row .amt{font-weight:600;font-variant-numeric:tabular-nums}
.invest-row .reason{font-size:.75em;opacity:.5}
.remaining-box{margin-top:16px;padding:14px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);font-size:.85em;line-height:1.6}
.btc-card{background:rgba(245,158,11,.04);border:1px solid rgba(245,158,11,.2);border-radius:16px;padding:20px;margin-bottom:20px}
.btc-card h2{color:#f59e0b}
.btc-status{padding:12px 16px;border-radius:10px;margin-top:12px;font-size:.88em;line-height:1.5}
.btc-waiting{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.15)}
.btc-active{background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.15)}
.btc-note{font-size:.78em;opacity:.5;margin-top:10px;line-height:1.5}
.btn{font-family:'Inter',sans-serif;padding:10px 20px;border-radius:10px;border:none;color:#fff;font-size:.85em;cursor:pointer;font-weight:500;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,#667eea,#764ba2)}
.btn-secondary{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.history-chart{width:100%;height:160px;position:relative;margin-top:12px}
.history-list{max-height:160px;overflow-y:auto;font-size:.78em;margin-top:12px}
.history-list .entry{display:flex;justify-content:space-between;padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.05)}
.sync-status{font-size:.72em;opacity:.5;text-align:center;margin-top:8px}
.nav-link{position:fixed;top:16px;left:16px;font-size:.85em;opacity:.5;text-decoration:none;color:#fff}
.nav-link:hover{opacity:1}
</style>
</head>
<body>
<a href="index.html" class="nav-link">← Calendario</a>

<div id="lock">
<h2>locked</h2>
<input type="password" id="pw" placeholder="Password" onkeydown="if(event.key==='Enter')unlock()">
<button onclick="unlock()">Entra</button>
<div class="err" id="err"></div>
</div>

<div id="app">
<div class="container">
<h1>Finance Rebalancer</h1>
<p class="subtitle">Aggiorna i saldi — vedi dove sei — investi smart</p>

<div class="total-bar">
<div class="big" id="totalDisplay">-</div>
<div class="sub" id="totalSub"></div>
</div>

<div class="alert-box" id="alertBox"></div>

<!-- Saldi -->
<div class="card">
<h2>Saldi Attuali</h2>
<div class="grid4">
<div class="field"><label>ACWI (Equity)</label><input type="number" id="s_acwi" step="0.01" oninput="calc()"></div>
<div class="field"><label>Gov Bond</label><input type="number" id="s_gov" step="0.01" oninput="calc()"></div>
<div class="field"><label>CSH2</label><input type="number" id="s_csh2" step="0.01" oninput="calc()"></div>
<div class="field"><label>Santander</label><input type="number" id="s_sant" step="0.01" oninput="calc()"></div>
</div>
<div class="grid2" style="margin-top:12px">
<div class="field"><label>Saldo TR Cash</label><input type="number" id="s_trcash" step="0.01" oninput="calc()"></div>
<div class="field"><label>BTC (valore attuale, 0 se non comprato)</label><input type="number" id="s_btc" step="0.01" oninput="calc()"></div>
</div>
</div>

<!-- Allocation -->
<div class="card">
<h2>Allocazione vs Target</h2>
<div id="allocRows"></div>
</div>

<!-- Invest Now -->
<div class="card">
<h2>Investo Oggi</h2>
<div class="grid2">
<div class="field"><label>Quanto investo (da saldo TR)</label><input type="number" id="investAmt" step="100" oninput="calcSplit()"></div>
<div class="field"><label>.</label><button class="btn btn-secondary" style="width:100%;margin-top:0" onclick="suggestAmt()">Suggerisci importo</button></div>
</div>
<div class="invest-result" id="investResult" style="display:none"></div>
</div>

<!-- Remaining to allocate -->
<div class="remaining-box" id="remainingBox"></div>

<!-- BTC -->
<div class="btc-card">
<h2>Trade BTC</h2>
<div class="grid3">
<div class="field"><label>Budget riservato</label><input type="number" id="btcBudget" value="5000" step="100" oninput="calc()"></div>
<div class="field"><label>Entry target</label><input type="number" id="btcEntry" value="40000" step="1000" oninput="calc()"></div>
<div class="field"><label>Sell target</label><input type="number" id="btcSell" value="95000" step="1000" oninput="calc()"></div>
</div>
<div id="btcStatus"></div>
<p class="btc-note" id="btcNote"></p>
</div>

<!-- Save -->
<div class="card">
<h2>Salva</h2>
<div class="actions">
<button class="btn btn-primary" onclick="saveSnapshot()">Salva Snapshot</button>
<button class="btn btn-secondary" onclick="syncToGist()">Sync Cloud</button>
<button class="btn btn-secondary" onclick="syncFromGist()">Carica Cloud</button>
</div>
<div class="sync-status" id="syncStatus"></div>
</div>

<!-- History -->
<div class="card">
<h2>Storico</h2>
<div class="history-chart"><canvas id="chartCanvas"></canvas></div>
<div class="history-list" id="historyList"></div>
</div>

</div>
</div>

<script>
const GIST_ID='17fedcdc8ee90458b9513999b55a4813',GIST_FILE='finance.json',PASS='flavmori2210';
const KEYS=['acwi','gov','csh2','sant','trcash','btc'];
const LABELS={acwi:'ACWI',gov:'Gov Bond',csh2:'CSH2',sant:'Santander',trcash:'TR Cash',btc:'BTC'};
const COLORS={acwi:'#667eea',gov:'#34d399',csh2:'#fbbf24',sant:'#f87171',trcash:'#94a3b8',btc:'#f59e0b'};
const TARGETS={investito:79,liquidita:14,buffer:7};
const INVEST_RATIO={acwi:0.80,gov:0.20};
let history=[];

function unlock(){
  if(document.getElementById('pw').value===PASS){
    localStorage.setItem('fin_auth','1');
    document.getElementById('lock').style.display='none';
    document.getElementById('app').style.display='block';
    init();
  }else{document.getElementById('err').textContent='No'}
}

function init(){
  let s=JSON.parse(localStorage.getItem('fin_saldi')||'null')||{};
  KEYS.forEach(k=>{if(s[k])document.getElementById('s_'+k).value=s[k]});
  let b=JSON.parse(localStorage.getItem('fin_btc')||'null')||{};
  if(b.budget)document.getElementById('btcBudget').value=b.budget;
  if(b.entry)document.getElementById('btcEntry').value=b.entry;
  if(b.sell)document.getElementById('btcSell').value=b.sell;
  history=JSON.parse(localStorage.getItem('fin_history')||'[]');
  calc();renderHistory();
}

function getS(){let s={};KEYS.forEach(k=>s[k]=parseFloat(document.getElementById('s_'+k).value)||0);return s}

function calc(){
  const s=getS();
  const btcBudget=parseFloat(document.getElementById('btcBudget').value)||0;
  const total=KEYS.reduce((a,k)=>a+s[k],0);
  const investito=s.acwi+s.gov;
  const liquidita=s.csh2+s.sant;
  const btcReserved=s.btc>0?0:Math.min(btcBudget,s.trcash);
  const bufferFree=s.trcash-btcReserved;

  // Total display
  document.getElementById('totalDisplay').textContent=total>0?'€'+fmt(total):'-';
  if(total>0){
    const ratio=investito>0?Math.round(s.acwi/investito*100)+'/'+Math.round(s.gov/investito*100):'—';
    document.getElementById('totalSub').innerHTML=
      `Investito: €${fmt(investito)} (ratio ${ratio})<br>Liquido: €${fmt(liquidita)} | Buffer TR: €${fmt(s.trcash)}`+(s.btc>0?` | BTC: €${fmt(s.btc)}`:'');
  }

  // Liquidity alert
  const liqPct=total>0?liquidita/total*100:0;
  const ab=document.getElementById('alertBox');
  if(total>0&&liqPct<TARGETS.liquidita){
    ab.className='alert-box alert-warn show';
    ab.textContent='Liquidita al '+liqPct.toFixed(1)+'% — sotto target ('+TARGETS.liquidita+'%). Valuta di rallentare gli investimenti.';
  }else if(total>0){
    ab.className='alert-box alert-ok show';
    ab.textContent='Liquidita OK: '+liqPct.toFixed(1)+'% (target '+TARGETS.liquidita+'%)';
  }else{ab.className='alert-box'}

  // Allocation rows
  const buckets=[
    {name:'Investito',sub:'ACWI+Gov (80/20)',val:investito,target:TARGETS.investito,color:'#667eea'},
    {name:'Liquidita',sub:'CSH2+Santander',val:liquidita,target:TARGETS.liquidita,color:'#fbbf24'},
    {name:'Buffer TR',sub:btcReserved>0?`€${fmt(btcReserved)} riservati BTC`:'Per tranches future',val:s.trcash,target:TARGETS.buffer,color:'#94a3b8'},
  ];
  let html='';
  buckets.forEach(b=>{
    const pct=total>0?b.val/total*100:0;
    const targetE=b.target/100*total;
    const gap=targetE-b.val;
    const maxBar=Math.max(pct,b.target,1);
    const barW=pct/maxBar*100;
    const tgtPos=b.target/maxBar*100;
    const gapTxt=Math.abs(gap)<50?'<span class="muted">in target</span>':(gap>0?`<span class="neg">-€${fmt(Math.abs(gap))}</span>`:`<span class="pos">+€${fmt(Math.abs(gap))} sopra</span>`);
    html+=`<div class="alloc-row">
      <div class="name">${b.name}<br><span style="font-size:.75em;opacity:.5">${b.sub}</span></div>
      <div class="bar-wrap"><div class="bar-fill" style="width:${barW}%;background:${b.color};opacity:.6"></div><div class="bar-target" style="left:${tgtPos}%"></div><div class="bar-label">${pct.toFixed(1)}%</div></div>
      <div class="info">${gapTxt}<br><span class="muted">€${fmt(b.val)} / €${fmt(targetE)}</span></div>
    </div>`;
  });
  document.getElementById('allocRows').innerHTML=html;

  // Remaining box
  const toInvest=Math.max(0,bufferFree-(TARGETS.buffer/100*total));
  document.getElementById('remainingBox').innerHTML=total>0?
    `<strong>Da allocare:</strong> €${fmt(toInvest)} disponibili nel buffer TR (esclusi €${fmt(btcReserved)} riservati BTC)<br><span class="muted">Target buffer a regime: €${fmt(TARGETS.buffer/100*total)} (7% del patrimonio)</span>`:'';

  // BTC
  calcBtc(s,total);
  // Save
  localStorage.setItem('fin_saldi',JSON.stringify(s));
  localStorage.setItem('fin_btc',JSON.stringify({budget:btcBudget,entry:+document.getElementById('btcEntry').value||0,sell:+document.getElementById('btcSell').value||0}));
  calcSplit();
}

function calcBtc(s,total){
  const budget=parseFloat(document.getElementById('btcBudget').value)||0;
  const entry=parseFloat(document.getElementById('btcEntry').value)||0;
  const sell=parseFloat(document.getElementById('btcSell').value)||0;
  let html='',note='';
  if(s.btc>0){
    const potentialGain=(sell/entry-1)*s.btc;
    html=`<div class="btc-status btc-active"><strong>Trade attivo</strong> — €${fmt(s.btc)} in BTC<br>Se vendi a €${fmt(sell)}: guadagno lordo ~€${fmt(potentialGain)} (tasse ES ~21% sulla plusvalenza)</div>`;
    note='Quando vendi, sposta il ricavato in ACWI. Rimetti BTC a 0.';
  }else{
    const canAfford=s.trcash>=budget;
    html=`<div class="btc-status btc-waiting"><strong>In attesa</strong> — €${fmt(budget)} riservati nel saldo TR<br>Compra quando BTC tocca ~€${fmt(entry)}. Metti alert su Trade Republic.</div>`;
    if(!canAfford)html+=`<div style="margin-top:8px;font-size:.8em;color:#f87171">Non hai abbastanza nel saldo TR per il budget BTC</div>`;
    note=`Quei €${fmt(budget)} sono congelati. Il calcolatore non li conta come disponibili per il PAC. Se BTC non scende a €${fmt(entry)} entro fine estate, reinvestili in ACWI.`;
  }
  document.getElementById('btcStatus').innerHTML=html;
  document.getElementById('btcNote').textContent=note;
}

function suggestAmt(){
  const s=getS();
  const total=KEYS.reduce((a,k)=>a+s[k],0);
  const btcBudget=parseFloat(document.getElementById('btcBudget').value)||0;
  const btcReserved=s.btc>0?0:Math.min(btcBudget,s.trcash);
  const bufferTarget=TARGETS.buffer/100*total;
  const available=s.trcash-btcReserved-bufferTarget;
  const suggested=Math.max(0,Math.min(available,Math.round(available/5/100)*100*2||2500));// ~1/3 of available, rounded
  document.getElementById('investAmt').value=Math.min(2500,Math.max(500,Math.round(suggested/500)*500));
  calcSplit();
}

function calcSplit(){
  const amt=parseFloat(document.getElementById('investAmt').value)||0;
  const box=document.getElementById('investResult');
  if(amt<=0){box.style.display='none';return}
  box.style.display='block';

  const s=getS();
  const total=KEYS.reduce((a,k)=>a+s[k],0);
  if(total<=0){box.innerHTML='<p class="muted">Inserisci i saldi prima</p>';return}

  const investito=s.acwi+s.gov;
  const liquidita=s.csh2+s.sant;

  // Calculate gap for each bucket
  const investTarget=TARGETS.investito/100*total;
  const liqTarget=TARGETS.liquidita/100*total;
  const investGap=Math.max(0,investTarget-investito);
  const liqGap=Math.max(0,liqTarget-liquidita);
  const totalGap=investGap+liqGap;

  let toInvest=amt,toLiq=0;
  if(totalGap>0&&liqGap>0){
    // Proportional split between invest and liquidity based on gaps
    toLiq=Math.min(amt,Math.round(amt*liqGap/totalGap));
    toInvest=amt-toLiq;
  }
  // If liquidity is already above target, everything goes to invest
  if(liqGap<=0){toInvest=amt;toLiq=0}

  // Inside invest: split by 80/20 ratio gap
  const acwiTarget=0.80*investTarget;
  const govTarget=0.20*investTarget;
  const acwiGap=Math.max(0,acwiTarget-s.acwi);
  const govGap=Math.max(0,govTarget-s.gov);
  const invGapTotal=acwiGap+govGap;

  let toAcwi,toGov;
  if(invGapTotal>0){
    toAcwi=Math.round(toInvest*acwiGap/invGapTotal);
    toGov=toInvest-toAcwi;
  }else{
    toAcwi=Math.round(toInvest*0.80);
    toGov=toInvest-toAcwi;
  }

  // After investment, show new ratio
  const newAcwi=s.acwi+toAcwi;
  const newGov=s.gov+toGov;
  const newInvest=newAcwi+newGov;
  const newRatio=newInvest>0?Math.round(newAcwi/newInvest*100)+'/'+Math.round(newGov/newInvest*100):'—';

  let html=`<h3>Metti €${fmt(amt)} cosi:</h3>`;
  if(toAcwi>0)html+=`<div class="invest-row"><span>ACWI</span><span class="amt" style="color:${COLORS.acwi}">€${fmt(toAcwi)}</span></div>`;
  if(toGov>0)html+=`<div class="invest-row"><span>Gov Bond</span><span class="amt" style="color:${COLORS.gov}">€${fmt(toGov)}</span></div>`;
  if(toLiq>0)html+=`<div class="invest-row"><span>Liquidita (CSH2)</span><span class="amt" style="color:${COLORS.csh2}">€${fmt(toLiq)}</span></div>`;
  html+=`<div class="invest-row" style="opacity:.5"><span>Dopo: ratio investito ${newRatio} | investito ${((newInvest+s.csh2+s.sant+toLiq)>0?((newInvest)/(total)*100).toFixed(1):'0')}% del totale</span><span></span></div>`;

  box.innerHTML=html;
}

function saveSnapshot(){
  const s=getS();const total=KEYS.reduce((a,k)=>a+s[k],0);
  if(total<=0)return;
  const entry={date:new Date().toISOString().slice(0,10),total,breakdown:{...s}};
  history=history.filter(h=>h.date!==entry.date);
  history.push(entry);history.sort((a,b)=>a.date.localeCompare(b.date));
  localStorage.setItem('fin_history',JSON.stringify(history));
  renderHistory();
  document.getElementById('syncStatus').textContent='Salvato — '+new Date().toLocaleTimeString();
}

function renderHistory(){
  const list=document.getElementById('historyList');
  let html='';
  [...history].reverse().forEach(h=>{html+=`<div class="entry"><span>${h.date}</span><span>€${fmt(h.total)}</span></div>`});
  list.innerHTML=html||'<div class="muted" style="padding:8px;text-align:center">Nessun dato</div>';
  drawChart();
}

function drawChart(){
  const canvas=document.getElementById('chartCanvas');
  const ctx=canvas.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  const rect=canvas.parentElement.getBoundingClientRect();
  canvas.width=rect.width*dpr;canvas.height=160*dpr;ctx.scale(dpr,dpr);
  const W=rect.width,H=160;ctx.clearRect(0,0,W,H);
  if(history.length<2){ctx.fillStyle='rgba(255,255,255,.25)';ctx.font='12px Inter';ctx.textAlign='center';ctx.fillText('Minimo 2 snapshot',W/2,H/2);return}
  const vals=history.map(h=>h.total);const min=Math.min(...vals)*.95,max=Math.max(...vals)*1.05;
  const pad={t:16,b:24,l:46,r:16};
  ctx.strokeStyle='rgba(255,255,255,.06)';ctx.lineWidth=1;
  for(let i=0;i<4;i++){const y=pad.t+(H-pad.t-pad.b)*i/3;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();ctx.fillStyle='rgba(255,255,255,.3)';ctx.font='9px Inter';ctx.textAlign='right';ctx.fillText('€'+fmt(max-(max-min)*i/3),pad.l-5,y+3)}
  const grad=ctx.createLinearGradient(0,0,W,0);grad.addColorStop(0,'#667eea');grad.addColorStop(1,'#764ba2');
  ctx.strokeStyle=grad;ctx.lineWidth=2;ctx.lineJoin='round';ctx.beginPath();
  history.forEach((h,i)=>{const x=pad.l+i*(W-pad.l-pad.r)/(history.length-1);const y=pad.t+(1-(h.total-min)/(max-min))*(H-pad.t-pad.b);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)});ctx.stroke();
  history.forEach((h,i)=>{const x=pad.l+i*(W-pad.l-pad.r)/(history.length-1);const y=pad.t+(1-(h.total-min)/(max-min))*(H-pad.t-pad.b);ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill()});
  ctx.fillStyle='rgba(255,255,255,.3)';ctx.font='9px Inter';ctx.textAlign='center';
  const step=Math.max(1,Math.floor(history.length/5));
  history.forEach((h,i)=>{if(i%step===0||i===history.length-1){const x=pad.l+i*(W-pad.l-pad.r)/(history.length-1);ctx.fillText(h.date.slice(5),x,H-6)}});
}

function getToken(){return localStorage.getItem('gh_token')||prompt('GitHub Token:')}
async function syncToGist(){
  const token=getToken();if(!token)return;localStorage.setItem('gh_token',token);
  const s=getS();const data={saldi:s,btc:{budget:+document.getElementById('btcBudget').value,entry:+document.getElementById('btcEntry').value,sell:+document.getElementById('btcSell').value},history,updated:new Date().toISOString()};
  try{const r=await fetch('https://api.github.com/gists/'+GIST_ID,{method:'PATCH',headers:{'Authorization':'token '+token,'Content-Type':'application/json'},body:JSON.stringify({files:{[GIST_FILE]:{content:JSON.stringify(data)}}})});
  document.getElementById('syncStatus').textContent=r.ok?'Cloud aggiornato — '+new Date().toLocaleTimeString():'Errore '+r.status}catch(e){document.getElementById('syncStatus').textContent='Errore: '+e.message}
}
async function syncFromGist(){
  const token=getToken();if(!token)return;localStorage.setItem('gh_token',token);
  try{const r=await fetch('https://api.github.com/gists/'+GIST_ID,{headers:{'Authorization':'token '+token}});if(!r.ok)return;
  const g=await r.json();if(!g.files[GIST_FILE])return;const data=JSON.parse(g.files[GIST_FILE].content);
  if(data.saldi)KEYS.forEach(k=>{document.getElementById('s_'+k).value=data.saldi[k]||0});
  if(data.btc){document.getElementById('btcBudget').value=data.btc.budget||5000;document.getElementById('btcEntry').value=data.btc.entry||40000;document.getElementById('btcSell').value=data.btc.sell||95000}
  if(data.history){history=data.history;localStorage.setItem('fin_history',JSON.stringify(history))}
  calc();renderHistory();document.getElementById('syncStatus').textContent='Caricato — '+new Date().toLocaleTimeString()}catch(e){document.getElementById('syncStatus').textContent='Errore: '+e.message}
}
