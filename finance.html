<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0b0f1a;min-height:100vh;padding:20px;color:#cbd5e1;font-size:13px}
#lock{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;gap:14px}
#lock input{font-family:'Inter',sans-serif;padding:11px 18px;border-radius:6px;border:1px solid #1e293b;background:#0f172a;color:#f1f5f9;font-size:1em;text-align:center;width:200px}
#lock button{padding:9px 22px;border-radius:6px;border:none;background:#2563eb;color:#fff;font-size:.85em;cursor:pointer;font-weight:500}
#lock .err{color:#ef4444;font-size:.75em}
#app{display:none}
.wrap{max-width:780px;margin:0 auto}
header{text-align:center;margin-bottom:24px}
header h1{font-size:1.3em;font-weight:700;color:#f8fafc;letter-spacing:-.02em}
header p{font-size:.7em;opacity:.3;margin-top:3px;text-transform:uppercase;letter-spacing:.08em}
.total{text-align:center;font-size:1.8em;font-weight:700;color:#f8fafc;margin-bottom:4px}
.total-sub{text-align:center;font-size:.72em;opacity:.3;margin-bottom:20px}
.section{margin-bottom:20px}
.section-head{font-size:.68em;font-weight:600;text-transform:uppercase;letter-spacing:.07em;opacity:.3;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid #1e293b}
.row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #111827}
.row:last-child{border:none}
.row .label{font-size:.82em;color:#94a3b8}
.row .label small{opacity:.5;margin-left:4px}
.row .value{font-size:.82em;font-weight:600;font-variant-numeric:tabular-nums;color:#f1f5f9}
.row .pct{font-size:.7em;opacity:.4;margin-left:6px}
.row .gap{font-size:.72em;margin-left:8px}
.pos{color:#10b981}.neg{color:#ef4444}
.input-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #111827}
.input-row:last-child{border:none}
.input-row label{font-size:.78em;color:#94a3b8;flex:1}
.input-row input{font-family:'Inter',sans-serif;width:110px;padding:6px 8px;border-radius:4px;border:1px solid #1e293b;background:#0f172a;color:#f1f5f9;font-size:.85em;text-align:right}
.input-row input:focus{outline:none;border-color:#2563eb}
.suggest{background:#0f172a;border:1px solid #1e293b;border-radius:8px;padding:14px;margin-bottom:20px}
.suggest .head{font-size:.7em;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#60a5fa;margin-bottom:10px}
.suggest .avail{font-size:.9em;margin-bottom:10px;color:#f8fafc;font-weight:600}
.suggest .action{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #1e293b;font-size:.82em}
.suggest .action:last-child{border:none}
.suggest .action .av{font-weight:600;font-variant-numeric:tabular-nums}
.suggest .sep{margin:10px 0;border-top:1px solid #1e293b}
.suggest .note{font-size:.7em;opacity:.3}
.rb-alert{background:#1e1033;border:1px solid #4c1d95;border-radius:6px;padding:10px 14px;margin-bottom:12px;font-size:.78em;color:#a78bfa}
.footer{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{padding:7px 14px;border-radius:5px;border:none;color:#fff;font-size:.72em;cursor:pointer;font-weight:500}
.btn-p{background:#2563eb}
.btn-s{background:#1e293b;border:1px solid #334155}
.sync{font-size:.6em;opacity:.25;text-align:center;margin-top:5px}
.hist{margin-top:12px}
.hist canvas{width:100%;height:100px}
.hist .list{max-height:80px;overflow-y:auto;font-size:.65em;margin-top:6px}
.hist .list div{display:flex;justify-content:space-between;padding:2px 4px;border-bottom:1px solid #111827}
.sett-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.8);z-index:100;overflow-y:auto;padding:40px 20px}
.sett-panel{max-width:500px;margin:0 auto;background:#0f172a;border:1px solid #1e293b;border-radius:10px;padding:24px}
.sett-panel h2{font-size:1em;font-weight:600;color:#f8fafc;margin-bottom:16px}
.sett-panel .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.sett-panel label{font-size:.68em;opacity:.4;text-transform:uppercase;display:block;margin-bottom:3px}
.sett-panel input{font-family:'Inter',sans-serif;width:100%;padding:7px 9px;border-radius:4px;border:1px solid #1e293b;background:#0b0f1a;color:#f1f5f9;font-size:.85em}
.sett-panel input:focus{outline:none;border-color:#2563eb}
.sett-panel .msg{font-size:.7em;opacity:.4;margin-top:4px}
.sett-panel .close{margin-top:16px}
</style>
</head>
<body>
<div id="lock">
<input type="password" id="pw" placeholder="Password" onkeydown="if(event.key==='Enter')unlock()">
<button onclick="unlock()">Enter</button>
<div class="err" id="err"></div>
</div>
<div id="app"><div class="wrap">
<header><h1>Portfolio Rebalancer</h1><p>Allocation · Rebalancing · Tracking</p></header>
<div class="total" id="tot">-</div>
<div class="total-sub" id="totD"></div>

<div class="section" id="balSection">
<div class="section-head">Balances</div>
<div class="input-row"><label>Equity <small>(ACWI)</small></label><input type="number" id="s_eq" step=".01" oninput="calc()"></div>
<div class="input-row"><label>Bond <small>(Gov EUR)</small></label><input type="number" id="s_bo" step=".01" oninput="calc()"></div>
<div class="input-row"><label>Money Market <small>(CSH2)</small></label><input type="number" id="s_mm" step=".01" oninput="calc()"></div>
<div class="input-row"><label>Cash <small>(Santander)</small></label><input type="number" id="s_c1" step=".01" oninput="calc()"></div>
<div class="input-row"><label>Cash <small>(Trade Republic)</small></label><input type="number" id="s_c2" step=".01" oninput="calc()"></div>
<div class="input-row"><label>Cash <small>(Other)</small></label><input type="number" id="s_c3" step=".01" oninput="calc()"></div>
<div class="input-row"><label>Satellite <small>(BTC)</small></label><input type="number" id="s_sa" step=".01" oninput="calc()"></div>
</div>

<div class="section">
<div class="section-head">Allocation</div>
<div id="alloc"></div>
</div>

<div id="rbAlert"></div>
<div class="suggest" id="sug"></div>

<div class="hist">
<div class="section-head">History</div>
<canvas id="cv"></canvas>
<div class="list" id="hl"></div>
</div>

<div class="footer">
<button class="btn btn-p" onclick="save()">Save</button>
<button class="btn btn-s" onclick="toG()">Sync</button>
<button class="btn btn-s" onclick="frG()">Load</button>
<button class="btn btn-s" onclick="openS()">Settings</button>
</div>
<div class="sync" id="ss"></div>
</div></div>

<div class="sett-overlay" id="sOv">
<div class="sett-panel">
<h2>Settings</h2>
<p style="font-size:.72em;opacity:.4;margin-bottom:14px">Target allocation (must sum 100%)</p>
<div class="g2">
<div><label>Equity %</label><input type="number" id="t_eq" step="1" oninput="upT()"></div>
<div><label>Bond %</label><input type="number" id="t_bo" step="1" oninput="upT()"></div>
<div><label>Money Market %</label><input type="number" id="t_mm" step="1" oninput="upT()"></div>
<div><label>Cash Floor %</label><input type="number" id="t_ca" step="1" oninput="upT()"></div>
<div><label>Satellite %</label><input type="number" id="t_sa" step="1" oninput="upT()"></div>
</div>
<div class="msg" id="tMsg"></div>
<p style="font-size:.72em;opacity:.4;margin:14px 0 8px">Caps</p>
<div class="g2">
<div><label>Investment Cap (€)</label><input type="number" id="cfg_cap" step="100" oninput="calc()"></div>
<div><label>Satellite Cap (€)</label><input type="number" id="cfg_capSa" step="100" oninput="calc()"></div>
</div>
<p style="font-size:.72em;opacity:.4;margin:14px 0 8px">BTC Trade</p>
<div class="g2">
<div><label>Entry Price (€)</label><input type="number" id="btc_entry" step="1000" oninput="saveBtc()"></div>
<div><label>Sell Price (€)</label><input type="number" id="btc_sell" step="1000" oninput="saveBtc()"></div>
</div>
<button class="btn btn-s close" onclick="closeS()">Close</button>
</div>
</div>

<script>
const GID='17fedcdc8ee90458b9513999b55a4813',GF='finance.json',PW='flavmori2210';
const KS=['eq','bo','mm','c1','c2','c3','sa'];
let T={eq:64,bo:16,mm:9,ca:6,sa:5};
let cfg={cap:2500,capSa:2500};
let btc={entry:40000,sell:95000};
let hist=[];

function unlock(){if($('pw').value===PW){localStorage.setItem('fa','1');show();init()}else $('err').textContent='Wrong'}
function show(){$('lock').style.display='none';$('app').style.display='block'}
function $(id){return document.getElementById(id)}
function J(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function fm(n){return Math.round(n).toLocaleString('it-IT')}
function getS(){let s={};KS.forEach(k=>s[k]=parseFloat($('s_'+k).value)||0);return s}

function init(){
  const s=J('fs')||{};KS.forEach(k=>{if(s[k])$('s_'+k).value=s[k]});
  T=J('ft')||T;cfg=J('fc')||cfg;btc=J('fb')||btc;hist=J('fh')||[];
  $('t_eq').value=T.eq;$('t_bo').value=T.bo;$('t_mm').value=T.mm;$('t_ca').value=T.ca;$('t_sa').value=T.sa;
  $('cfg_cap').value=cfg.cap;$('cfg_capSa').value=cfg.capSa;
  $('btc_entry').value=btc.entry;$('btc_sell').value=btc.sell;
  calc();rH();
}

function calc(){
  const s=getS();
  const total=KS.reduce((a,k)=>a+s[k],0);
  const eq=s.eq,bo=s.bo,mm=s.mm,cash=s.c1+s.c2+s.c3,sat=s.sa;
  const invested=eq+bo;

  $('tot').textContent=total>0?'€'+fm(total):'-';
  if(total>0){
    const r=invested>0?Math.round(eq/invested*100)+'/'+Math.round(bo/invested*100):'—';
    $('totD').textContent=`Invested €${fm(invested)} (${r}) · Liquid €${fm(mm+cash)} · Satellite €${fm(sat)}`;
  }

  // Allocation P&L style
  const bks=[
    {n:'Equity',s:'ACWI',v:eq,t:T.eq},
    {n:'Bond',s:'Gov EUR',v:bo,t:T.bo},
    {n:'Money Market',s:'CSH2',v:mm,t:T.mm},
    {n:'Cash Floor',s:'Accounts',v:cash,t:T.ca},
    {n:'Satellite',s:'BTC',v:sat,t:T.sa},
  ];
  let ah='';
  bks.forEach(b=>{
    const pct=total>0?(b.v/total*100).toFixed(1):'0.0';
    const te=b.t/100*total;
    const gap=te-b.v;
    const gs=Math.abs(gap)<50?'':gap>0?`<span class="neg gap">-€${fm(Math.abs(gap))}</span>`:`<span class="pos gap">+€${fm(-gap)}</span>`;
    ah+=`<div class="row"><span class="label">${b.n} <small>${b.s}</small></span><span><span class="value">€${fm(b.v)}</span><span class="pct">${pct}% / ${b.t}%</span>${gs}</span></div>`;
  });
  $('alloc').innerHTML=ah;

  // Rebalance alert
  let rb='';
  if(invested>0){
    const idealR=T.eq/(T.eq+T.bo)*100;
    const actualR=eq/invested*100;
    if(Math.abs(actualR-idealR)>5){
      const from=actualR>idealR?'Equity':'Bond';
      const to=actualR>idealR?'Bond':'Equity';
      const amt=Math.round(Math.abs(eq-(idealR/100)*invested));
      rb=`<div class="rb-alert">Rebalance: sell €${fm(amt)} ${from} → buy ${to} (ratio ${Math.round(actualR)}/${Math.round(100-actualR)} vs ${Math.round(idealR)}/${Math.round(100-idealR)} target)</div>`;
    }
  }
  $('rbAlert').innerHTML=rb;

  // Suggestions
  const cap=cfg.cap||2500;
  const capSa=cfg.capSa||2500;
  const cashTarget=T.ca/100*total;
  const mmTarget=T.mm/100*total;
  const eqTarget=T.eq/100*total;
  const boTarget=T.bo/100*total;
  const saTarget=T.sa/100*total;
  const cashExcess=Math.max(0,cash-cashTarget);
  const mmGap=Math.max(0,mmTarget-mm);
  const eqGap=Math.max(0,eqTarget-eq);
  const boGap=Math.max(0,boTarget-bo);
  const saGap=Math.max(0,saTarget-sat);

  let sg=`<div class="head">Actions</div>`;
  sg+=`<div class="avail">Available: €${fm(cashExcess)}</div>`;
  let any=false;

  // Money Market (no cap)
  if(mmGap>0&&cashExcess>0){
    const mv=Math.min(mmGap,cashExcess);
    if(mv>=50){
      sg+=`<div class="action"><span>Move to Money Market</span><span class="av" style="color:#f59e0b">€${fm(mv)}</span></div>`;
      any=true;
    }
  }

  // Invest (capped)
  const afterMm=Math.max(0,cashExcess-Math.max(0,mmGap));
  if(afterMm>=300){
    const amt=Math.min(afterMm,cap);
    const invGap=eqGap+boGap;
    let toEq,toBo;
    if(invGap>0){toEq=Math.round(amt*eqGap/invGap);toBo=amt-toEq}
    else{const r=T.eq/(T.eq+T.bo);toEq=Math.round(amt*r);toBo=amt-toEq}
    if(any)sg+=`<div class="sep"></div>`;
    sg+=`<div class="action"><span>Equity <small>(ACWI)</small></span><span class="av" style="color:#3b82f6">€${fm(toEq)}</span></div>`;
    sg+=`<div class="action"><span>Bond <small>(Gov EUR)</small></span><span class="av" style="color:#10b981">€${fm(toBo)}</span></div>`;
    if(afterMm>cap)sg+=`<div class="action"><span class="note">Remaining</span><span class="note">€${fm(afterMm-cap)}</span></div>`;
    any=true;
  }else if(eqGap+boGap>0&&!any){
    sg+=`<div class="action"><span class="note">Not enough surplus to invest. Accumulate.</span><span></span></div>`;
  }

  // Satellite (own cap)
  if(saGap>0){
    const saAmt=Math.min(saGap,capSa);
    if(any)sg+=`<div class="sep"></div>`;
    sg+=`<div class="action"><span>Satellite <small>(BTC at ~€${fm(btc.entry)})</small></span><span class="av" style="color:#ef4444">€${fm(saAmt)}</span></div>`;
    any=true;
  }else if(sat>saTarget+100){
    if(any)sg+=`<div class="sep"></div>`;
    sg+=`<div class="action"><span class="note">Satellite over target — consider profit</span><span class="pos">+€${fm(sat-saTarget)}</span></div>`;
  }

  if(!any)sg+=`<div class="action"><span class="note">All on target.</span><span></span></div>`;
  $('sug').innerHTML=sg;

  // Persist
  localStorage.setItem('fs',JSON.stringify(s));
  cfg={cap:parseFloat($('cfg_cap').value)||2500,capSa:parseFloat($('cfg_capSa').value)||2500};
  localStorage.setItem('fc',JSON.stringify(cfg));
}

function openS(){$('sOv').style.display='block'}
function closeS(){$('sOv').style.display='none'}
function upT(){
  T={eq:+$('t_eq').value||0,bo:+$('t_bo').value||0,mm:+$('t_mm').value||0,ca:+$('t_ca').value||0,sa:+$('t_sa').value||0};
  const s=T.eq+T.bo+T.mm+T.ca+T.sa;
  $('tMsg').innerHTML=Math.abs(s-100)>0.5?`<span class="neg">Total: ${s}% (must be 100)</span>`:`Total: ${s}%`;
  localStorage.setItem('ft',JSON.stringify(T));calc();
}
function saveBtc(){btc={entry:+$('btc_entry').value||40000,sell:+$('btc_sell').value||95000};localStorage.setItem('fb',JSON.stringify(btc));calc()}

function save(){
  const s=getS();const total=KS.reduce((a,k)=>a+s[k],0);if(total<=0)return;
  const e={d:new Date().toISOString().slice(0,10),t:total,s:{...s}};
  hist=hist.filter(x=>x.d!==e.d);hist.push(e);hist.sort((a,b)=>a.d.localeCompare(b.d));
  localStorage.setItem('fh',JSON.stringify(hist));rH();
  $('ss').textContent='Saved '+new Date().toLocaleTimeString();
}

function rH(){
  let h='';[...hist].reverse().forEach(e=>{h+=`<div>${e.d}<span>€${fm(e.t)}</span></div>`});
  $('hl').innerHTML=h||'<div style="opacity:.2;text-align:center;padding:4px">No data</div>';dC();
}

function dC(){
  const c=$('cv'),x=c.getContext('2d'),d=window.devicePixelRatio||1;
  const W=c.parentElement.offsetWidth,H=100;
  c.width=W*d;c.height=H*d;c.style.height=H+'px';x.scale(d,d);x.clearRect(0,0,W,H);
  if(hist.length<2){x.fillStyle='rgba(255,255,255,.1)';x.font='10px Inter';x.textAlign='center';x.fillText('Min 2 snapshots',W/2,H/2);return}
  const vs=hist.map(h=>h.t),mn=Math.min(...vs)*.95,mx=Math.max(...vs)*1.05;
  const p={t:8,b:14,l:36,r:8};
  x.strokeStyle='#1e293b';
  for(let i=0;i<3;i++){const y=p.t+(H-p.t-p.b)*i/2;x.beginPath();x.moveTo(p.l,y);x.lineTo(W-p.r,y);x.stroke();x.fillStyle='rgba(255,255,255,.15)';x.font='7px Inter';x.textAlign='right';x.fillText('€'+fm(mx-(mx-mn)*i/2),p.l-3,y+3)}
  x.strokeStyle='#2563eb';x.lineWidth=1.5;x.lineJoin='round';x.beginPath();
  hist.forEach((h,i)=>{const px=p.l+i*(W-p.l-p.r)/(hist.length-1);const py=p.t+(1-(h.t-mn)/(mx-mn))*(H-p.t-p.b);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke();
  hist.forEach((h,i)=>{const px=p.l+i*(W-p.l-p.r)/(hist.length-1);const py=p.t+(1-(h.t-mn)/(mx-mn))*(H-p.t-p.b);x.beginPath();x.arc(px,py,2,0,Math.PI*2);x.fillStyle='#60a5fa';x.fill()});
}

function tk(){return localStorage.getItem('ght')||prompt('GitHub Token:')}
async function toG(){
  const t=tk();if(!t)return;localStorage.setItem('ght',t);
  const d={s:getS(),T,cfg,btc,h:hist,u:new Date().toISOString()};
  try{const r=await fetch('https://api.github.com/gists/'+GID,{method:'PATCH',headers:{'Authorization':'token '+t,'Content-Type':'application/json'},body:JSON.stringify({files:{[GF]:{content:JSON.stringify(d)}}})});$('ss').textContent=r.ok?'Synced':'Err '+r.status}catch(e){$('ss').textContent=e.message}
}
async function frG(){
  const t=tk();if(!t)return;localStorage.setItem('ght',t);
  try{const r=await fetch('https://api.github.com/gists/'+GID,{headers:{'Authorization':'token '+t}});if(!r.ok)return;
  const g=await r.json();if(!g.files[GF])return;const d=JSON.parse(g.files[GF].content);
  if(d.s)KS.forEach(k=>{$('s_'+k).value=d.s[k]||0});
  if(d.T){T=d.T;$('t_eq').value=T.eq;$('t_bo').value=T.bo;$('t_mm').value=T.mm;$('t_ca').value=T.ca;$('t_sa').value=T.sa}
  if(d.cfg){cfg=d.cfg;$('cfg_cap').value=cfg.cap;$('cfg_capSa').value=cfg.capSa}
  if(d.btc){btc=d.btc;$('btc_entry').value=btc.entry;$('btc_sell').value=btc.sell}
  if(d.h){hist=d.h;localStorage.setItem('fh',JSON.stringify(hist))}
  localStorage.setItem('ft',JSON.stringify(T));localStorage.setItem('fc',JSON.stringify(cfg));localStorage.setItem('fb',JSON.stringify(btc));
  calc();rH();$('ss').textContent='Loaded'}catch(e){$('ss').textContent=e.message}
}

if(localStorage.getItem('fa')==='1'){show();if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init()}else $('pw').focus();
window.addEventListener('resize',dC);
</script>
</body>
</html>
